name: cancel-obsolete-merge-groups

on:
  delete:
  workflow_run:
    workflows: [ci]
    types: [requested, completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-obsolete-merge-groups
  cancel-in-progress: false

jobs:
  cancel:
    if: >-
      (github.event_name == 'delete' &&
       github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'gh-readonly-queue/')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-latest
    steps:
      # workflow_run has a write token. Never check out or execute merge-group code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = new Map();
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const matches = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, event: 'merge_group', status, per_page: 100,
              });
              for (const run of matches) runs.set(run.id, run);
            }
            for (const run of runs.values()) {
              if (run.event !== 'merge_group' || !run.head_branch?.startsWith('gh-readonly-queue/')) continue;
              try {
                await github.rest.git.getRef({owner, repo, ref: `heads/${run.head_branch}`});
                continue;
              } catch (error) {
                // Only an absent queue ref proves that a group is obsolete.
                if (error.status !== 404) throw error;
              }
              const {data: latest} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: run.id});
              if (latest.status === 'completed') continue;
              try {
                // Force cancellation also stops jobs with always() cleanup conditions.
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                  owner, repo, run_id: run.id,
                });
                core.info(`Cancelled obsolete merge-group run ${run.id}`);
              } catch (error) {
                if (error.status !== 409) throw error;
                const {data: finished} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: run.id});
                if (finished.status !== 'completed') throw error;
              }
            }
