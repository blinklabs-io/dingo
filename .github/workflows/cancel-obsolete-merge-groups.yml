name: cancel-obsolete-merge-groups

on:
  delete:
  workflow_run:
    workflows: [ci]
    types: [requested, completed]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: >-
      (github.event_name == 'delete' &&
       github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'gh-readonly-queue/')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-latest
    concurrency:
      group: cancel-obsolete-merge-groups
      cancel-in-progress: false
    steps:
      # workflow_run has a write token. Never check out or execute merge-group code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = new Map();
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const matches = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, event: 'merge_group', status, per_page: 100,
              });
              for (const run of matches) runs.set(run.id, run);
            }
            const failures = [];
            const cancelling = [];
            async function cancel(run_id, endpoint) {
              try {
                await github.request(`POST /repos/{owner}/{repo}/actions/runs/{run_id}/${endpoint}`, {
                  owner, repo, run_id,
                });
              } catch (error) {
                if (error.status !== 409) throw error;
                const {data: finished} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
                if (finished.status !== 'completed') throw error;
              }
            }
            for (const run of runs.values()) {
              if (run.event !== 'merge_group' || !run.head_branch?.startsWith('gh-readonly-queue/')) continue;
              try {
                try {
                  await github.rest.git.getRef({owner, repo, ref: `heads/${run.head_branch}`});
                  continue;
                } catch (error) {
                  // Only an absent queue ref proves that a group is obsolete.
                  if (error.status !== 404) throw error;
                }
                const {data: latest} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: run.id});
                if (latest.status === 'completed') continue;
                await cancel(run.id, 'cancel');
                cancelling.push(run.id);
                core.info(`Requested cancellation of obsolete merge-group run ${run.id}`);
              } catch (error) {
                core.error(`Failed to inspect or cancel run ${run.id}: ${error.message}`);
                failures.push(error);
              }
            }
            // Give every runner time to finish cleanup without waiting separately for each run.
            if (cancelling.length) await new Promise(resolve => setTimeout(resolve, 30000));
            for (const run_id of cancelling) {
              try {
                const {data: latest} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
                if (latest.status === 'completed') continue;
                await cancel(run_id, 'force-cancel');
                core.info(`Forced cancellation of unresponsive obsolete merge-group run ${run_id}`);
              } catch (error) {
                core.error(`Failed to finish cancellation of run ${run_id}: ${error.message}`);
                failures.push(error);
              }
            }
            if (failures.length) throw new AggregateError(failures, 'Merge-group cleanup failed');
