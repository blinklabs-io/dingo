name: go-test

# Runs on pull requests and on pushes to main. Both matter: the pull-request
# run is where breakage should be caught, and the main run is the backstop that
# catches anything a merge conflict, a stale base, or a paths filter let
# through. Release-tag validation lives in publish.yml.
#
# Windows and macOS were dropped from pull-request CI in #3070 and race
# instrumentation was left to release time, to reduce Actions usage. Dingo is a
# public repository, so that traded latency for nothing billable, and it cost
# more than it saved: go-test-platforms failed on four consecutive main pushes
# (#3728, Windows-only DevNet breakage), and the v0.70.3 tag was abandoned when
# the release-only race gate failed in run 33315370942 with the tag already
# pushed. Both classes are visible on a pull request again here.
on:
  pull_request:
  push:
    branches: ['main']
  # go-test-platforms.yml carried the platform jobs and offered this so a
  # branch could be checked before merging. The jobs run on every pull request
  # now, but keep the manual entry point for a branch with no pull request yet.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseding push or force-push must not accumulate runners, on a branch
  # or on main. A cancelled main run still leaves the newest commit validated,
  # which costs bisect precision on a burst of merges but never coverage.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Linux job with Postgres, MySQL and MinIO (fake s3) services for integration tests
  go-test-linux:
    # Do not add a matrix dimension to this job or rename it without updating
    # branch protection: GitHub appends the matrix combination to a job name
    # that contains no expression, so this renders as the required context
    # "go-test (Linux) (1.26.x)".
    name: go-test (Linux)
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: ubuntu-latest
    # Backstop only, replacing GitHub's 360-minute default; the per-step
    # -timeout values are the diagnostics. Higher than the other jobs here
    # because this one's slow steps serialize: db-integration (10m),
    # live-lifecycle (20m) and go-test (30m) all precede each other.
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dingo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
          MYSQL_DATABASE: dingo_test
        options: >-
          --health-cmd "sh -c 'mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      minio:
        image: blinklabs/minio:main
        options: >-
          --health-cmd "curl localhost:9000"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
          - 9001:9001
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: dingo_test
      MYSQL_HOST: localhost
      MYSQL_PORT: '3306'
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_DATABASE: dingo_test
      MYSQL_ROOT_PASSWORD: mysql
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: "http://127.0.0.1:9000/"
      AWS_REGION: us-east-1
      DINGO_TEST_S3_BUCKET: dingo-test
    steps:
      - name: setup-s3-bucket
        run: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install --update
            aws --endpoint-url "$AWS_ENDPOINT" s3api create-bucket --bucket "$DINGO_TEST_S3_BUCKET"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - name: go-build-minimal
        run: go build ./cmd/dingo
      - name: sqlc-generation-drift
        run: make sql-check
      - name: install-mariadb-client
        # database/plugin/metadata/mysql's backup/restore CLI arg mapping
        # (mysqlSSLArgs) targets the mysqldump/mysql client this repo's own
        # Docker image ships (Debian's default-mysql-client, which resolves
        # to MariaDB's client), not real MySQL's -- ubuntu-latest's
        # preinstalled mysqldump is real MySQL's and rejects that flag set
        # outright. Installing the same client the runtime image uses keeps
        # this job testing the actual deployed combination.
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          mysqldump --version
      - name: sqlstore-database-integration
        env:
          DINGO_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/dingo_test?sslmode=disable
          DINGO_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/dingo_test?parseTime=true
        # database/plugin/metadata/{postgres,mysql} carry their own
        # dingo_db_integration-tagged tests (backup/restore/reset round
        # trips, timeout enforcement) reading these same DINGO_*_DSN vars --
        # include them here, not just sqlstore, or they never compile in CI.
        run: >-
          go test -tags 'dingo_extra_plugins dingo_db_integration'
          ./database/plugin/metadata/sqlstore
          ./database/plugin/metadata/postgres
          ./database/plugin/metadata/mysql
          -timeout 10m
      - name: go-test-live-lifecycle
        # These two-node tests exercise live Truncate/Restore while a real
        # producer is forging and the syncer is connected over loopback.
        run: make test-live-lifecycle
      - name: go-test
        # No race instrumentation here on purpose: this is the fast Linux
        # signal, and go-test-linux-race covers the same packages in parallel.
        # -timeout is 30m rather than 20m because this job's service DSNs put
        # internal/test/conformance on real Postgres and MySQL as well as
        # SQLite, which took 917s of a 20m budget in run 33521250798.
        run: go test -tags dingo_extra_plugins -ldflags="-s -w" -timeout 30m ./...

  # Race detection on every pull request, not only on a release tag. The
  # release-only arrangement is what abandoned v0.70.3: a genuine race-detector
  # failure in ./ledger surfaced with the tag already pushed, and the whole
  # publication was skipped.
  #
  # Deliberately a separate job from go-test-linux rather than a -race flag
  # added to it. Race instrumentation roughly doubles the suite, so folding it
  # in would have made the one Linux gate the slowest signal on every pull
  # request; running it alongside keeps first-failure feedback where it was.
  #
  # It also runs without the service containers on purpose. The Postgres and
  # MySQL variants in internal/test/conformance gate on POSTGRES_PASSWORD /
  # POSTGRES_DSN and MYSQL_ROOT_PASSWORD / MYSQL_DSN and t.Skip when unset (see
  # conformance_postgres_test.go's postgresConfigured), so with no job env here
  # that suite replays its vectors against SQLite only. go-test-linux already
  # covers those two backends, and replaying them under race instrumentation
  # would dominate this job -- conformance alone took 917s uninstrumented with
  # the services attached, against 86s SQLite-only.
  go-test-linux-race:
    name: go-test (Linux, race)
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: ubuntu-latest
    # Only a backstop against a wedged runner, replacing GitHub's 360-minute
    # default. The per-package -timeout below is what actually diagnoses a
    # hang; this cap must stay well clear of a legitimately slow run so it
    # cannot fail the job without naming a stuck test.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Race-instrumented objects are a separate build-cache population
          # from the plain ones, so this job keys its own entry rather than
          # thrashing go-test-linux's.
          key: ${{ runner.os }}-go-race-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-${{ matrix.go-version }}-
      - name: go-build
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - name: go-test-race
        # Same command as publish.yml's tagged release gate, so a pull request
        # cannot pass a check the release then fails. 30m rather than 20m
        # because ./ledger alone runs 9-13 minutes under the race detector and
        # reached the old 20m limit in run 33315370942.
        run: go test -tags dingo_extra_plugins -ldflags="-s -w" -race -timeout 30m ./...

  # windows-latest and macos-latest also run the full ./... suite in
  # publish.yml's go-test-other, but only at release-tag time, after a change
  # has already merged. That is how the Windows-only DevNet breakage in #3728
  # reached main four merges running, and how the Windows extraction code in
  # mithril (NtCreateFile/NtSetInformationFile handle-relative rename and
  # removal, see extract_handlerelative_windows.go and #3228) went unverified
  # on real Windows CI. Both platforms run on every pull request here.
  #
  # These are separate jobs rather than one platform matrix so that a failure
  # on one platform cannot cancel the other's run, and so each renders a stable
  # check name distinct from publish.yml's go-test (windows-latest) /
  # go-test (macos-latest).
  go-test-windows:
    name: go-test (Windows)
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: windows-latest
    # See go-test-linux-race: backstop only, per-package -timeout is the
    # diagnostic. The suite ran 17m44s here in run 33519632627.
    timeout-minutes: 90
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build ./...
      - name: go-test
        # -timeout is the diagnostic: it panics with a goroutine dump naming
        # the stuck test, which a runner-level kill does not produce. 30m
        # matches the other jobs here; ./database was the slowest package at
        # 737s in run 33519632627.
        #
        # There is deliberately no step-level cap. A step or job kill reports
        # no stuck test, so an intermediate bound tight enough to be useful is
        # also tight enough to kill a slow-but-healthy run and destroy the
        # attribution this job exists to provide.
        run: go test -ldflags="-s -w" -timeout 30m ./...

  go-test-macos:
    name: go-test (macOS)
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: macos-latest
    # See go-test-windows. macOS is the cheapest of the three by a wide
    # margin -- the suite ran 4m07s in run 33519632627 -- so the same generous
    # cap costs nothing here.
    timeout-minutes: 90
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build ./...
      - name: go-test
        run: go test -ldflags="-s -w" -timeout 30m ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          # This job runs `go run ...@latest`, so third-party code executes in
          # the workspace. Do not leave GITHUB_TOKEN in the local git config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: govulncheck
        # This CI check is not currently a required branch-protection context.
        # govulncheck exits non-zero only for vulnerabilities this module
        # actually calls, so the unreachable findings it also prints (currently
        # GO-2026-5932, an unmaintained golang.org/x/crypto package with no
        # fixed version) do not fail the job.
        # Both the toolchain and the scanner float on purpose: a pin on either
        # one parks a new advisory behind a stale version instead of forcing it
        # to be fixed. The stdlib version reported against is whatever go.mod's
        # toolchain floor and this runner resolve to. Run through the Makefile
        # so this CI check and `make govulncheck` cannot drift apart.
        run: make govulncheck
