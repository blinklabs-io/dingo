name: ci

# The test pipeline. Each test mode runs once per change, in one of two tiers:
#
#   Tier 1, pull_request: developer feedback on the pull request's head.
#     check          1 runner. Change detection, docs-parity, lint, nilaway,
#                    modernize, config-parity, both builds, sqlc drift, npm
#                    test and the whole Go suite on SQLite, no race.
#     govulncheck    1 runner, ~1 minute. Fails the run but gates nothing, so
#                    a new upstream advisory cannot block every merge while it
#                    is triaged.
#
#   Tier 2, merge_group: the merge queue tests the exact commit that will land
#   on main, and covers only what tier 1 did not.
#     gate (race)      the whole suite under -race, SQLite only
#     gate (services)  the Postgres/MySQL/S3 integration and service-backed
#                      packages, no race
#     gate (macOS)     the whole suite on macOS
#     gate (build)     every release binary target plus the Docker image
#
# Main and release tags run no tests at all: the merge queue fast-forwards main
# to the commit it tested, so publish.yml only builds and publishes. A release
# tag checks that its commit passed every tier-2 gate before it creates the
# draft release.
#
# Why it is shaped this way: blinklabs-io is on the free plan, which allows 20
# concurrent jobs across every repository in the organization and 5 concurrent
# macOS jobs. The previous pipeline ran the Go suite four times on every pull
# request push (quick, services, three race shards, macOS) and the same four
# again on every merge to main -- ~114 runner-minutes per push and ~171 per
# merge, with p90 queue waits of 30 minutes on pull requests and 89 minutes on
# main. A change now peaks at two concurrent jobs on its pull request and four
# in the merge queue.
#
# Every tier-2 job is required for the merge queue and reports as skipped on a
# pull request; every tier-1 job reports as skipped in the merge queue. GitHub
# counts a skipped required check as passing, so one set of required checks
# serves both events without either tier running twice.
#
# Until the merge queue is enabled for main, the repository variable
# CI_MERGE_QUEUE is unset and tier 2 also runs on pull requests after check
# passes, so nothing loses coverage in between. Set CI_MERGE_QUEUE=true when
# the merge-queue ruleset is turned on. workflow_dispatch always runs both
# tiers, which is also the manual way to give a commit the tier-2 results a
# release tag requires.
#
# Windows is omitted from CI and releases.
on:
  pull_request:
  merge_group:
  # Keeps a manual entry point for a branch with no pull request yet.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the branch cancels the run for the commit it replaced, so a
  # force-push or a rapid series of pushes cannot accumulate runners. Each
  # merge-queue group has its own head ref.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Tier 1. One runner for the whole developer loop, cheapest steps first, so
  # a change that does not compile fails in minutes without a second job ever
  # queueing for a runner.
  check:
    name: check
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # Backstop against a wedged runner only, replacing GitHub's 360-minute
    # default. The go test -timeout below is the diagnostic.
    timeout-minutes: 60
    outputs:
      run-ci: ${{ steps.detect.outputs.run-ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: runner-probe-start
        run: python3 .github/scripts/runner-probe.py start
      # The documentation-only classifier comes from the base revision, so a
      # pull request cannot edit it to skip its own CI. It is checked out into
      # a dot-directory, which the Go tooling ignores, and removed as soon as
      # it has run.
      - name: checkout-trusted-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: .trusted-ci
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -f .trusted-ci/.github/scripts/ci-changes.sh ]]; then
            bash .trusted-ci/.github/scripts/ci-changes.sh
          else
            echo "run-ci=true" >> "$GITHUB_OUTPUT"
          fi
          rm -rf .trusted-ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.10-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.10-
      # These two run on documentation-only changes too.
      - name: docs-parity
        run: make docs-parity
      - name: test-change-selection
        run: python3 .github/scripts/test-ci-changes.py
      # One step per Go module.
      #
      # internal/docsparity's TestLintCoversEveryGoModule derives the module
      # list from the tree and fails until every go.mod has a step here, so a
      # nested module added later cannot go unlinted just because these steps
      # are written out by hand.
      - name: golangci-lint (root)
        if: steps.detect.outputs.run-ci == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
      # Unpinned like golangci-lint above, so a new analyzer release's findings
      # are fixed when it lands. Both run through the Makefile so this job and
      # `make lint` use the same build tags, flags, and package set.
      - name: install nilaway and modernize
        if: steps.detect.outputs.run-ci == 'true'
        run: |
          go install go.uber.org/nilaway/cmd/nilaway@latest
          go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest
      - name: nilaway
        if: steps.detect.outputs.run-ci == 'true'
        run: make nilaway
      - name: modernize
        if: steps.detect.outputs.run-ci == 'true'
        run: make modernize
      # The network configs under config/cardano/ exist twice: embedded in the
      # binary here (config/cardano/embed.go), and in
      # blinklabs-io/docker-cardano-configs, which the release image ships as
      # /opt/cardano/config/. CARDANO_NETWORK=<net> resolves to one or the
      # other depending on how dingo was deployed, so the same network name
      # means the same chain only while the two stay identical.
      #
      # Compares against the cardano-configs image tag the Dockerfile pins,
      # which is what a built image actually contains, so a config change is
      # satisfiable inside one pull request: bump the pinned tag and update
      # config/cardano/ in the same commit. The scheduled drift report against
      # that repository's main branch stays in config-parity.yml.
      - name: config-parity
        if: steps.detect.outputs.run-ci == 'true'
        run: make config-parity
      - name: go-build
        if: steps.detect.outputs.run-ci == 'true'
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - name: go-build-minimal
        # The default build has no plugin build tags, so a change that only
        # compiles with dingo_extra_plugins breaks the released binary.
        if: steps.detect.outputs.run-ci == 'true'
        run: go build ./cmd/dingo
      - name: go-vet-386
        # Vet rather than a 386 build target: go build skips _test.go files,
        # and a constant that overflows a 32-bit int there breaks the tree too.
        if: steps.detect.outputs.run-ci == 'true'
        run: GOARCH=386 go vet -tags dingo_extra_plugins ./...
      - name: sqlc-generation-drift
        if: steps.detect.outputs.run-ci == 'true'
        run: make sql-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        if: steps.detect.outputs.run-ci == 'true'
        with:
          node-version: '22.18.0'
      - name: npm-test
        if: steps.detect.outputs.run-ci == 'true'
        run: npm test
      - name: go-test
        # No services and no -race: the Postgres and MySQL variants in
        # internal/test/conformance gate on POSTGRES_PASSWORD / MYSQL_DSN and
        # friends and t.Skip when unset, so this replays vectors against SQLite
        # only. gate (services) and gate (race) cover the rest on the merged
        # commit.
        if: steps.detect.outputs.run-ci == 'true'
        run: go test -tags dingo_extra_plugins -ldflags="-s -w" -timeout 30m ./...
      - name: runner-probe-end
        if: always()
        run: python3 .github/scripts/runner-probe.py end

  # Tier 1, beside check. Deliberately not a dependency of anything: a new
  # advisory landing upstream must not block every merge in the repository
  # while it is triaged. It still fails the run. A release tag does gate on it,
  # in publish.yml.
  govulncheck:
    name: govulncheck
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          # This job runs a checksum-pinned third-party scanner in
          # the workspace. Do not leave GITHUB_TOKEN in the local git config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.10-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.10-
      - name: govulncheck
        # govulncheck exits non-zero only for vulnerabilities this module
        # actually calls, so the unreachable findings it also prints (currently
        # GO-2026-5932, an unmaintained golang.org/x/crypto package with no
        # fixed version) do not fail the job.
        # The scanner binary is pinned while its vulnerability database remains
        # live. Run through the Makefile so this CI check and `make
        # govulncheck` cannot drift apart.
        run: make govulncheck

  # Tier 2. The whole suite under the race detector on one runner, SQLite only.
  # Race detection runs on every merged commit, not only on a release tag: the
  # release-only arrangement is what abandoned v0.70.3, when a genuine
  # race-detector failure in ./ledger surfaced with the tag already pushed.
  #
  # It runs without the service containers on purpose. The Postgres and MySQL
  # variants in internal/test/conformance gate on POSTGRES_PASSWORD /
  # POSTGRES_DSN and MYSQL_ROOT_PASSWORD / MYSQL_DSN and t.Skip when unset, so
  # with no job env here that suite replays its vectors against SQLite only.
  # gate (services) covers those backends; replaying them under race
  # instrumentation would dominate this job -- conformance alone took 917s
  # uninstrumented with the services attached, against 86s SQLite-only.
  #
  # Tests that only run single-goroutine computation or assert SQLite query
  # plans call testutil.SkipUnderRace; check runs them un-instrumented.
  #
  # One job rather than the three shards it used to be: sharding cost the same
  # runner-minutes plus two extra checkouts, toolchain setups and race builds
  # of the dependencies, and held three runners at once.
  race:
    name: gate (race)
    needs: [check]
    if: >-
      !cancelled()
      && (github.event_name == 'merge_group'
      || ((github.event_name == 'workflow_dispatch' || vars.CI_MERGE_QUEUE != 'true')
      && needs.check.result == 'success'
      && needs.check.outputs.run-ci == 'true'))
    runs-on: ubuntu-latest
    # Only a backstop against a wedged runner, replacing GitHub's 360-minute
    # default. The per-package -timeout below is what actually diagnoses a
    # hang; this cap must stay well clear of a legitimately slow run so it
    # cannot fail the job without naming a stuck test.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: runner-probe-start
        run: python3 .github/scripts/runner-probe.py start
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-race-1.26.10-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-1.26.10-
      - name: go-test-race
        # -timeout stays at 60m so a hang is still named by the per-package
        # panic before the job backstop above fires.
        run: go test -v -tags dingo_extra_plugins -ldflags="-s -w" -race -timeout 60m ./...
      - name: runner-probe-end
        if: always()
        run: python3 .github/scripts/runner-probe.py end

  # Tier 2. Linux with Postgres, MySQL and MinIO (fake s3) services, running
  # only what the services add: the dingo_db_integration suites, the live
  # two-node lifecycle tests, and the packages whose tests read a service
  # variable. Everything else in the tree already ran in check and gate (race).
  services:
    name: gate (services)
    needs: [check]
    if: >-
      !cancelled()
      && (github.event_name == 'merge_group'
      || ((github.event_name == 'workflow_dispatch' || vars.CI_MERGE_QUEUE != 'true')
      && needs.check.result == 'success'
      && needs.check.outputs.run-ci == 'true'))
    runs-on: ubuntu-latest
    # Backstop only, replacing GitHub's 360-minute default; the per-step
    # -timeout values are the diagnostics. The slow steps serialize:
    # db-integration (10m), live-lifecycle (20m) and the service-backed
    # packages (60m). internal/docsparity's
    # TestPackageTimeoutsStayUnderJobBackstops keeps that ordering.
    timeout-minutes: 120
    services:
      minio:
        image: ghcr.io/blinklabs-io/minio:main@sha256:4682bc04bc46ae19aca740dfcdb7341399669fd7fe23f74271e9d09d36a88ada
        options: >-
          --health-cmd "curl localhost:9000"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
          - 9001:9001
    env:
      DINGO_CI_PG_CONTAINER: dingo-ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}-services
      DINGO_CI_MYSQL_CONTAINER: dingo-ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}-services
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: dingo_test
      MYSQL_HOST: localhost
      MYSQL_PORT: '3306'
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_DATABASE: dingo_test
      MYSQL_ROOT_PASSWORD: mysql
      AWS_ENDPOINT: "http://127.0.0.1:9000/"
      AWS_REGION: us-east-1
      DINGO_TEST_S3_BUCKET: dingo-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: runner-probe-start
        run: python3 .github/scripts/runner-probe.py start
      - name: start-test-databases
        run: |
          set -euo pipefail
          docker run --detach --name "$DINGO_CI_PG_CONTAINER" \
            --publish 5432:5432 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=dingo_test \
            --health-cmd pg_isready --health-interval 10s \
            --health-timeout 5s --health-retries 5 \
            postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          docker run --detach --name "$DINGO_CI_MYSQL_CONTAINER" \
            --publish 3306:3306 \
            --env MYSQL_ROOT_PASSWORD=mysql --env MYSQL_USER=mysql \
            --env MYSQL_PASSWORD=mysql --env MYSQL_DATABASE=dingo_test \
            --health-cmd 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"' \
            --health-interval 10s --health-timeout 5s --health-start-period 10s \
            --health-retries 4 \
            mysql:8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242 --innodb-file-per-table=OFF --innodb-flush-log-at-trx-commit=0 \
            --sync-binlog=0 --skip-log-bin
          for container in "$DINGO_CI_PG_CONTAINER" "$DINGO_CI_MYSQL_CONTAINER"; do
            for attempt in {1..60}; do
              if ! status="$(docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' "$container")"; then
                echo "Cannot inspect database container $container" >&2
                docker logs "$container"
                exit 1
              fi
              case "$status" in
                'running healthy') break ;;
                'running starting')
                  if (( attempt == 60 )); then
                    echo "Database container $container did not become healthy" >&2
                    docker logs "$container"
                    exit 1
                  fi
                  sleep 1
                  ;;
                *) docker logs "$container"; exit 1 ;;
              esac
            done
          done
      - name: install-aws-cli
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output awscliv2.zip \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.3.zip
          echo "78903b609938e6c06a02bd2c157af3af4fe184868e5507d6ed588cb68a7a2764  awscliv2.zip" \
            | sha256sum --check --strict -
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version | grep -F 'aws-cli/2.37.3 '
          {
            echo 'AWS_ACCESS_KEY_ID=minioadmin'
            echo 'AWS_SECRET_ACCESS_KEY=minioadmin'
          } >> "$GITHUB_ENV"
      - name: setup-s3-bucket
        run: aws --endpoint-url "$AWS_ENDPOINT" s3api create-bucket --bucket "$DINGO_TEST_S3_BUCKET"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.10-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.10-
      - name: install-mariadb-client
        # database/plugin/metadata/mysql's backup/restore CLI arg mapping
        # (mysqlSSLArgs) targets the mysqldump/mysql client this repo's own
        # Docker image ships (Debian's default-mysql-client, which resolves
        # to MariaDB's client), not real MySQL's -- ubuntu-latest's
        # preinstalled mysqldump is real MySQL's and rejects that flag set
        # outright. Installing the same client the runtime image uses keeps
        # this job testing the actual deployed combination.
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          mysqldump --version
      - name: sqlstore-database-integration
        env:
          DINGO_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/dingo_test?sslmode=disable
          DINGO_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/dingo_test?parseTime=true
        # database/plugin/metadata/{postgres,mysql} carry their own
        # dingo_db_integration-tagged tests (backup/restore/reset round
        # trips, timeout enforcement) reading these same DINGO_*_DSN vars --
        # include them here, not just sqlstore, or they never compile in CI.
        # The tagged build is a superset of each package's plain tests, so
        # the step below skips these four packages.
        run: >-
          go test -tags 'dingo_extra_plugins dingo_db_integration'
          ./database/plugin/metadata/sqlstore
          ./database/plugin/metadata/postgres
          ./database/plugin/metadata/mysql
          ./internal/node
          -timeout 10m
      - name: go-test-live-lifecycle
        # These two-node tests exercise live Truncate/Restore while a real
        # producer is forging and the syncer is connected over loopback.
        run: make test-live-lifecycle
      - name: go-test-service-packages
        # The packages whose tests read a service variable, found from the
        # tree rather than listed by hand, so a new service-backed test is
        # covered without editing this step.
        #
        # -timeout is a hang diagnostic rather than a budget: it panics with a
        # goroutine dump naming the stuck test, which this job's
        # timeout-minutes cannot do. internal/test/conformance on real
        # Postgres and MySQL is the long pole: it took 707-1238s across ten
        # consecutive runs and reached 1800s once, still issuing TRUNCATE
        # statements rather than deadlocked, so 60m leaves room for runner
        # speed without failing pull requests for it.
        run: |
          set -euo pipefail
          pattern='POSTGRES_PASSWORD|POSTGRES_DSN|MYSQL_ROOT_PASSWORD|MYSQL_DSN|DINGO_TEST_S3_BUCKET|DINGO_TEST_S3_ENDPOINT|AWS_ENDPOINT'
          pkgs=()
          while read -r pkg dir; do
            case "$pkg" in
              */internal/docsparity) continue ;;
              */database/plugin/metadata/sqlstore|*/database/plugin/metadata/postgres|*/database/plugin/metadata/mysql|*/internal/node) continue ;;
            esac
            if grep -qsE "$pattern" "$dir"/*_test.go; then
              pkgs+=("$pkg")
            fi
          done < <(go list -tags dingo_extra_plugins -f '{{.ImportPath}} {{.Dir}}' ./...)
          if (( ${#pkgs[@]} == 0 )); then
            echo "no service-backed packages found" >&2
            exit 1
          fi
          printf '%s\n' "${pkgs[@]}"
          go test -v -tags dingo_extra_plugins -ldflags="-s -w" -timeout 60m "${pkgs[@]}"
      - name: runner-probe-end
        if: always()
        run: python3 .github/scripts/runner-probe.py end
      - name: stop-test-databases
        if: always()
        run: |
          set -euo pipefail
          names="$(docker ps --all --format '{{.Names}}')"
          for container in "$DINGO_CI_PG_CONTAINER" "$DINGO_CI_MYSQL_CONTAINER"; do
            while IFS= read -r name; do
              if [ "$name" = "$container" ]; then
                docker rm --force "$container"
              fi
            done <<< "$names"
          done

  # Tier 2. The whole suite on macOS. The free plan allows only 5 concurrent
  # macOS jobs across the whole organization, which is the reason this is one
  # job rather than a matrix. The darwin binaries cross-compile in gate (build)
  # instead of on a second macOS runner.
  macos:
    name: gate (macOS)
    needs: [check]
    if: >-
      !cancelled()
      && (github.event_name == 'merge_group'
      || ((github.event_name == 'workflow_dispatch' || vars.CI_MERGE_QUEUE != 'true')
      && needs.check.result == 'success'
      && needs.check.outputs.run-ci == 'true'))
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: runner-probe-start
        run: python3 .github/scripts/runner-probe.py start
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-1.26.10-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.10-
      - name: go-test
        run: go test -v -ldflags="-s -w" -timeout 30m ./...
      - name: runner-probe-end
        if: always()
        run: python3 .github/scripts/runner-probe.py end

  # Tier 2. Every release binary target and the Docker image, on one runner.
  # Every binary builds CGO_ENABLED=0 (see the $(BINARIES) rule in the
  # Makefile), so the darwin targets cross-compile here as well as the Linux
  # and FreeBSD ones.
  build:
    name: gate (build)
    needs: [check]
    if: >-
      !cancelled()
      && (github.event_name == 'merge_group'
      || ((github.event_name == 'workflow_dispatch' || vars.CI_MERGE_QUEUE != 'true')
      && needs.check.result == 'success'
      && needs.check.outputs.run-ci == 'true'))
    runs-on: ubuntu-latest
    # Six cross-compiled targets plus the image build took 27 minutes in the
    # first merge-queue-era run. A timeout here ejects every pull request in
    # the queue group, so keep it well clear of a slow runner.
    timeout-minutes: 45
    env:
      GHCR_IMAGE_NAME: ghcr.io/blinklabs-io/dingo
    steps:
      # make build reads the version from `git describe`, which refuses to run
      # in a checkout git considers foreign-owned.
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.10-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.10-
      - name: build
        env:
          BUILD_TARGETS: linux/amd64 linux/arm64 freebsd/amd64 freebsd/arm64 darwin/amd64 darwin/arm64
        run: .github/scripts/build-targets.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: docker-check
        run: docker build --check .
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE_NAME }}
      - name: docker-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=
            COMMIT_HASH=${{ github.sha }}
