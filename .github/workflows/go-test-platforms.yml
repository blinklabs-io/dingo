name: go-test-platforms

# Windows and macOS were dropped from PR CI in #3070 to reduce Actions usage,
# and Windows had a history of getting stuck rather than failing. Both are
# addressed here: this does not run per-PR, and a stuck run is bounded at three
# levels instead of inheriting GitHub's 360-minute default.
#
# Platform-only breakage previously became visible only when a release tag was
# pushed, because publish.yml is the only other workflow that runs them. That
# cost the v0.70.0 tag: PR CI was green, the tag's Windows job failed, and
# build-binaries, build-images and finalize-release were all skipped. Running on
# pushes to main puts that signal before the tag.
on:
  # Validate a branch before merging it, without paying on every PR.
  workflow_dispatch:
  # Catch platform-only breakage after merge and before anyone tags.
  push:
    branches: ['main']

# A force-push or a run of pushes must not accumulate runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-test-platforms:
    # One context per platform, and distinct from publish.yml's release-only
    # matrix: branch protection matches a check by name, so two workflows
    # rendering the same job name would make a required context ambiguous.
    name: go-test (${{ matrix.platform }}) (${{ matrix.go-version }})
    strategy:
      # One platform failing is a result about that platform, so let the other
      # finish rather than losing its signal to the first failure.
      fail-fast: false
      matrix:
        go-version: [1.26.x]
        platform: [windows-latest, macos-latest]
        include:
          - platform: windows-latest
            cache_path: ~\AppData\Local\go-build
          - platform: macos-latest
            cache_path: ~/Library/Caches/go-build
    runs-on: ${{ matrix.platform }}
    # Only backstop, and deliberately generous. It matches the equivalent jobs
    # in publish.yml, which run the same command on the same runners, so this
    # job cannot false-fail on timing where the release job passes. Its purpose
    # is replacing GitHub's 360-minute default: a wedged run holds a shared
    # runner for 90 minutes rather than six hours.
    timeout-minutes: 90
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ${{ matrix.cache_path }}
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build ./...
      - name: go-test
        # -timeout is the diagnostic: it panics with a goroutine dump naming the
        # stuck test, which a runner-level kill does not produce. 20m matches
        # both the Linux PR job and the platform jobs in publish.yml.
        #
        # There is deliberately no step-level cap. A step or job kill reports no
        # stuck test, so an intermediate bound tight enough to be useful is also
        # tight enough to kill a slow-but-healthy run and destroy the
        # attribution this workflow exists to provide. The slowest package took
        # 937s in the v0.70.0 tag run, on a run that was failing, so the margin
        # on a shared runner is thinner than it looks.
        run: go test -ldflags="-s -w" -timeout 20m ./...
