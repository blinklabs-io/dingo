name: publish

# The main and release pipeline. It carries the same stages as the
# pull-request pipeline in go-test.yml, in the same order, and adds the
# publishing jobs after them:
#
#   lint, govulncheck                     2 runners, ~3 min
#     -> go-test (Linux, quick)           1 runner,  ~8 min
#       -> go-test (Linux)
#          go-test (Linux, race)
#          go-test (macOS)               3 runners, 5-35 min
#         -> create-draft-release        tag only, needs all three
#         -> build-<os>, build-images    gated on the SAME OS's tests
#           -> build-image-manifest
#             -> finalize-release        tag only
#
# A push to main runs this workflow and nothing else: go-test.yml is
# pull-request only. Previously a merge started go-test.yml's five jobs and
# this workflow's ten independently, sixteen runners at once, and the images
# and binaries published without waiting for any of them. Now the same merge
# peaks at about five concurrent jobs and nothing is published until tests
# that cover it are green.
#
# The difference between a main push and a release tag is signing and
# publishing the final artifacts. Both run every stage above and both push
# branch- or version-tagged images; only a tag creates a GitHub release,
# uploads binary archives and the conformance reports, attests the binaries,
# and finalizes the release.
#
# The stages are duplicated from go-test.yml rather than factored into a
# reusable workflow, because `needs:` cannot cross workflow files and a called
# workflow would rename every check context. internal/docsparity's
# TestPipelineStagesMatch fails when the two files drift.

on:
  push:
    branches: ['main']
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  # Main runs build images and binaries but do not publish release artifacts.
  # Give each main run its own group so a newer push cannot cancel the
  # backstop for an earlier merged commit. Keep every other ref serialized, so
  # re-pushing a tag cannot run two publications at once.
  #
  # Grouping main pushes by ref instead, so a newer merge supersedes an older
  # one, is what this repository ran before #4458 and moved away from: GitHub
  # keeps at most one pending run per group and cancels the earlier pending
  # one, so in a burst of merges the intermediate commits are skipped rather
  # than tested, and 8 of 10 main runs ended cancelled. What protects the
  # runner queue is the staging above instead, which cuts a merge's peak from
  # sixteen concurrent jobs to about five.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  # Never interrupt a tag release after publication has started.
  cancel-in-progress: false

env:
  APPLICATION_NAME: 'dingo'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # Stage 1. See go-test.yml's lint job for why these are steps of one job
  # rather than a matrix, and why internal/docsparity derives the module list
  # from the tree.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
      # Unpinned like golangci-lint above, so a new analyzer release's findings
      # are fixed when it lands. Both run through the Makefile so this job and
      # `make lint` use the same build tags, flags, and package set.
      - name: install nilaway and modernize
        run: |
          go install go.uber.org/nilaway/cmd/nilaway@latest
          go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest
      - name: nilaway
        run: make nilaway
      - name: modernize
        run: make modernize
      - name: config-parity
        run: make config-parity

  # Stage 1, alongside lint. Unlike go-test.yml's copy, this one gates
  # create-draft-release below.
  #
  # That is a restored gate, not a new one. `make govulncheck` used to be the
  # last step of the `ci` job and create-draft-release needed `[ci]`, so a
  # reachable vulnerability blocked a release. Splitting those steps into
  # separate jobs dropped the dependency along with the job, which would have
  # let a tag publish binaries and a GitHub release while govulncheck was
  # failing.
  #
  # It still does not gate the main-push path. The `ci` job was tag-only, so
  # main never had this gate, and a new advisory landing upstream must not
  # block every merge in the repository while it is triaged.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          # This job runs a checksum-pinned third-party scanner in
          # the workspace. Do not leave GITHUB_TOKEN in the local git config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: govulncheck
        run: make govulncheck

  # Stage 2. The cheap gate: whole suite on SQLite, no race, no services.
  # Decides whether it is worth spending four runners on the stage below.
  go-test-linux-quick:
    name: go-test (Linux, quick)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: runner-probe-start
        # Logs the runner's region, CPU, memory and fsync latency, so a slow
        # or red run can be attributed to its host without a re-run.
        run: python3 .github/scripts/runner-probe.py start
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: go-build
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: '22.18.0'
      - name: npm-test
        run: npm test
      - name: go-build-minimal
        run: go build ./cmd/dingo
      - name: sqlc-generation-drift
        run: make sql-check
      - name: go-test
        run: go test -tags dingo_extra_plugins -ldflags="-s -w" -timeout 30m ./...
      - name: runner-probe-end
        if: always()
        run: python3 .github/scripts/runner-probe.py end

  # Stage 3. Linux with Postgres, MySQL and MinIO (fake s3) services. Keeps
  # the real PostgreSQL, MySQL and S3 coverage that the release gate has
  # always had, uninstrumented: the conformance package alone approaches the
  # per-package timeout when PostgreSQL and MySQL run alongside SQLite under
  # -race, so service-backed coverage and race coverage are separate jobs.
  # See go-test.yml's go-test step for why that timeout is 20m.
  go-test-linux:
    name: go-test (Linux)
    needs: [go-test-linux-quick]
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      minio:
        image: ghcr.io/blinklabs-io/minio:main@sha256:4682bc04bc46ae19aca740dfcdb7341399669fd7fe23f74271e9d09d36a88ada
        options: >-
          --health-cmd "curl localhost:9000"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
          - 9001:9001
    env:
      DINGO_CI_PG_CONTAINER: dingo-ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}-go-test-linux-${{ matrix.go-version }}
      DINGO_CI_MYSQL_CONTAINER: dingo-ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}-go-test-linux-${{ matrix.go-version }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: dingo_test
      MYSQL_HOST: localhost
      MYSQL_PORT: '3306'
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_DATABASE: dingo_test
      MYSQL_ROOT_PASSWORD: mysql
      AWS_ENDPOINT: "http://127.0.0.1:9000/"
      AWS_REGION: us-east-1
      DINGO_TEST_S3_BUCKET: dingo-test
    steps:
      - name: start-test-databases
        run: |
          set -euo pipefail
          docker run --detach --name "$DINGO_CI_PG_CONTAINER" \
            --publish 5432:5432 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=dingo_test \
            --health-cmd pg_isready --health-interval 10s \
            --health-timeout 5s --health-retries 5 \
            postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          docker run --detach --name "$DINGO_CI_MYSQL_CONTAINER" \
            --publish 3306:3306 \
            --env MYSQL_ROOT_PASSWORD=mysql --env MYSQL_USER=mysql \
            --env MYSQL_PASSWORD=mysql --env MYSQL_DATABASE=dingo_test \
            --health-cmd 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"' \
            --health-interval 10s --health-timeout 5s --health-start-period 10s \
            --health-retries 4 \
            mysql:8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242 --innodb-file-per-table=OFF --innodb-flush-log-at-trx-commit=0 \
            --sync-binlog=0 --skip-log-bin
          for container in "$DINGO_CI_PG_CONTAINER" "$DINGO_CI_MYSQL_CONTAINER"; do
            for attempt in {1..60}; do
              if ! status="$(docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' "$container")"; then
                echo "Cannot inspect database container $container" >&2
                docker logs "$container"
                exit 1
              fi
              case "$status" in
                'running healthy') break ;;
                'running starting')
                  if (( attempt == 60 )); then
                    echo "Database container $container did not become healthy" >&2
                    docker logs "$container"
                    exit 1
                  fi
                  sleep 1
                  ;;
                *) docker logs "$container"; exit 1 ;;
              esac
            done
          done
      - name: install-aws-cli
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output awscliv2.zip \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.37.3.zip
          echo "78903b609938e6c06a02bd2c157af3af4fe184868e5507d6ed588cb68a7a2764  awscliv2.zip" \
            | sha256sum --check --strict -
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version | grep -F 'aws-cli/2.37.3 '
          {
            echo 'AWS_ACCESS_KEY_ID=minioadmin'
            echo 'AWS_SECRET_ACCESS_KEY=minioadmin'
          } >> "$GITHUB_ENV"
      - name: setup-s3-bucket
        run: aws --endpoint-url "$AWS_ENDPOINT" s3api create-bucket --bucket "$DINGO_TEST_S3_BUCKET"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: runner-probe-start
        # Logs the runner's region, CPU, memory and fsync latency, so a slow
        # or red run can be attributed to its host without a re-run.
        run: python3 .github/scripts/runner-probe.py start
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - name: install-mariadb-client
        # See go-test.yml: mysqlSSLArgs targets the MariaDB client the runtime
        # image ships, which ubuntu-latest's preinstalled mysqldump is not.
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          mysqldump --version
      - name: sqlstore-database-integration
        env:
          DINGO_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/dingo_test?sslmode=disable
          DINGO_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/dingo_test?parseTime=true
        run: >-
          go test -tags 'dingo_extra_plugins dingo_db_integration'
          ./database/plugin/metadata/sqlstore
          ./database/plugin/metadata/postgres
          ./database/plugin/metadata/mysql
          ./internal/node
          -timeout 10m
      - name: go-test-live-lifecycle
        run: make test-live-lifecycle
      - name: go-test
        run: go test -v -tags dingo_extra_plugins -ldflags="-s -w" -timeout 20m ./...
      - name: runner-probe-end
        if: always()
        run: python3 .github/scripts/runner-probe.py end
      - name: stop-test-databases
        if: always()
        run: |
          set -euo pipefail
          names="$(docker ps --all --format '{{.Names}}')"
          for container in "$DINGO_CI_PG_CONTAINER" "$DINGO_CI_MYSQL_CONTAINER"; do
            while IFS= read -r name; do
              if [ "$name" = "$container" ]; then
                docker rm --force "$container"
              fi
            done <<< "$names"
          done


  # Stage 3. Optional service backends are deliberately unconfigured here, so
  # internal/test/conformance replays its vectors against SQLite only. Same
  # command and shards as go-test.yml's race job, so a pull request cannot pass
  # a check the release then fails.
  go-test-linux-race:
    name: go-test (Linux, race)
    needs: [go-test-linux-quick]
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x]
        shard: [database, ledger, rest]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: runner-probe-start
        # Logs the runner's region, CPU, memory and fsync latency, so a slow
        # or red run can be attributed to its host without a re-run.
        run: python3 .github/scripts/runner-probe.py start
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      # The shards share one race build cache. Most of it is dependencies
      # compiled with -race, which every shard needs, and the repository
      # quota cannot hold one copy each. actions/cache keeps the first
      # upload of a key and does not merge, so only the rest shard saves:
      # it builds the most packages, and its entry holds about 87% of the
      # objects the three shards build between them.
      - name: restore race build cache
        if: matrix.shard != 'rest'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-race-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-${{ matrix.go-version }}-
      - name: save race build cache
        if: matrix.shard == 'rest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-race-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-${{ matrix.go-version }}-
      - name: go-build
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - name: go-test-race
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          database='/database($|/lifecycle|/plugin/blob|/plugin/metadata/sqlstore($|/))'
          ledger='/ledger($|/)|/internal/test/conformance'
          all="$(go list -tags dingo_extra_plugins ./...)"
          case "$SHARD" in
            database) selected="$(grep -E "$database" <<<"$all" || true)" ;;
            ledger) selected="$(grep -E "$ledger" <<<"$all" || true)" ;;
            rest) selected="$(grep -Ev "$database|$ledger" <<<"$all" || true)" ;;
            *) echo "unknown shard: $SHARD" >&2; exit 1 ;;
          esac
          if [ -z "$selected" ]; then
            echo "shard $SHARD selected no packages" >&2
            exit 1
          fi
          mapfile -t pkgs <<<"$selected"
          printf '%s\n' "${pkgs[@]}"
          go test -v -tags dingo_extra_plugins -ldflags="-s -w" -race -timeout 60m "${pkgs[@]}"
      - name: runner-probe-end
        if: always()
        run: python3 .github/scripts/runner-probe.py end

  # Stage 3. macOS coverage on the merge and release path, not only on a pull
  # request: a merge conflict, a stale base, or a force-push can land a tree
  # no pull request ever tested on this platform.
  go-test-macos:
    name: go-test (macOS)
    needs: [go-test-linux-quick]
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: runner-probe-start
        # Logs the runner's region, CPU, memory and fsync latency, so a slow
        # or red run can be attributed to its host without a re-run.
        run: python3 .github/scripts/runner-probe.py start
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build ./...
      - name: go-test
        run: go test -v -ldflags="-s -w" -timeout 30m ./...
      - name: runner-probe-end
        if: always()
        run: python3 .github/scripts/runner-probe.py end

  # A release draft is created only once the supported platforms are green,
  # so a tag
  # cannot reach a half-published state the way v0.70.3 did.
  validate-release-tag:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      package_version: ${{ steps.validate.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        id: validate
        env:
          CANDIDATE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(.github/scripts/validate-release-tag.sh "$CANDIDATE_RELEASE_TAG")"
          {
            echo "release_tag=$CANDIDATE_RELEASE_TAG"
            echo "package_version=$package_version"
          } >> "$GITHUB_OUTPUT"

  create-draft-release:
    name: create-draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - govulncheck
      - go-test-linux
      - go-test-linux-race
      - go-test-macos
      - validate-release-tag
    if: >-
      github.ref_type == 'tag'
      && needs.validate-release-tag.result == 'success'
    permissions:
      contents: write
    outputs:
      RELEASE_ID: ${{ steps.create-release.outputs.result }}
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.release_tag }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        id: create-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {...release, per_page: 100},
            );
            const matching = releases.filter(
              candidate => candidate.tag_name === process.env.RELEASE_TAG,
            );
            const published = matching.find(candidate => !candidate.draft);

            if (published) {
              throw new Error(
                `release ${process.env.RELEASE_TAG} is already published; ` +
                'refusing to delete it',
              );
            }

            for (const draft of matching) {
              await github.rest.repos.deleteRelease({
                owner: release.owner,
                repo: release.repo,
                release_id: draft.id,
              });
            }

            const response = await github.rest.repos.createRelease({
              draft: true,
              generate_release_notes: true,
              name: process.env.RELEASE_TAG,
              owner: release.owner,
              prerelease: false,
              repo: release.repo,
              tag_name: process.env.RELEASE_TAG,
            });

            return response.data.id;

  # Stage 4. One build job per remaining runner OS, each gated on its own tests,
  # replacing a 7-entry matrix of one-target jobs. See
  # .github/scripts/build-targets.sh.
  #
  # On a tag these also wait for create-draft-release, because the archives
  # they produce are uploaded to that draft. On a main push there is no draft
  # and no upload: the binaries are built as a cross-compilation check and
  # discarded, which is the whole of the difference between main and a release
  # for this stage.
  #
  # `always()` is required because create-draft-release is skipped on a main
  # push, and a skipped dependency would otherwise skip these too. Each test
  # dependency is then checked explicitly, or a failed one would pass the
  # guard.
  build-linux:
    name: build (Linux)
    needs: [go-test-linux, create-draft-release]
    if: >-
      always()
      && needs.go-test-linux.result == 'success'
      && (github.ref_type != 'tag' || needs.create-draft-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBOR_DATASET_REVISION: '6cd8c928665bbafe90e02066ebb4620e38f051de'
      NDC_LEDGER_REVISION: '8974561cb6b48807e2a578028d4f5d85430007a6'
      UPLC_CORPUS_SHA256: '8bd4ad4f9f4c8c6b8ffa1f06ed1db0b43043afbba77ef6a14bcfb5a52345ed3f'
      TURBO_CORPUS_SHA256: '821af55e3323c826b5598c964d634b46dd468014834d0e97ebdc5edb0a158576'
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: Build binaries
        env:
          BUILD_TARGETS: linux/amd64 linux/arm64 freebsd/amd64 freebsd/arm64
          # Empty on a main push, which tells the script to skip packaging.
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/build-targets.sh
      - name: Checkout CBOR conformance corpus
        if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          repository: r2rationality/cardano-cbor-dataset
          ref: ${{ env.CBOR_DATASET_REVISION }}
          path: .conformance/cardano-cbor-dataset
          persist-credentials: false
      - name: Checkout ledger-rules fixtures
        if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          repository: pragma-org/node-diversity-conformance
          ref: ${{ env.NDC_LEDGER_REVISION }}
          path: .conformance/node-diversity-conformance
          sparse-checkout: scenarios/ledger-rules/fixtures
          persist-credentials: false
      - name: Generate conformance reports
        if: github.ref_type == 'tag'
        timeout-minutes: 60
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CBOR_DATASET_DIR: .conformance/cardano-cbor-dataset
        run: .github/scripts/generate-conformance-reports.sh
      - name: Upload release assets
        if: github.ref_type == 'tag'
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_CONFORMANCE_REPORT: 'true'
        run: .github/scripts/upload-release-assets.sh
      - name: Attest binaries
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: dist/*/${{ env.APPLICATION_NAME }}

  build-macos:
    name: build (macOS)
    needs: [go-test-macos, create-draft-release]
    if: >-
      always()
      && needs.go-test-macos.result == 'success'
      && (github.ref_type != 'tag' || needs.create-draft-release.result == 'success')
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: Build binaries
        env:
          BUILD_TARGETS: darwin/amd64 darwin/arm64
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/build-targets.sh
      - name: Upload release assets
        if: github.ref_type == 'tag'
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-release-assets.sh
      - name: Attest binaries
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: dist/*/${{ env.APPLICATION_NAME }}

  # Stage 4. Images are linux artifacts, so they gate on the Linux tests.
  # Attestation is signing, which is why it is tag-only: a main push publishes
  # a branch-tagged image and stops there. Previously these attestations ran
  # on main under continue-on-error, which meant a main push both attested and
  # ignored the result.
  build-images:
    name: build-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    needs: [go-test-linux, create-draft-release]
    if: >-
      always()
      && needs.go-test-linux.result == 'success'
      && (github.ref_type != 'tag' || needs.create-draft-release.result == 'success')
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build images
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          outputs: "type=registry,push=true"
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
      - name: Attest Docker Hub image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: docker.io/blinklabs/dingo
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest GHCR image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - id: antithesis-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-antithesis-${{ matrix.arch }}
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build and push antithesis image
        id: antithesis-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          outputs: "type=registry,push=true"
          platforms: linux/${{ matrix.arch }}
          target: antithesis
          tags: ${{ steps.antithesis-meta.outputs.tags }}
          labels: ${{ steps.antithesis-meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
      - name: Attest antithesis Docker Hub image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: docker.io/blinklabs/dingo
          subject-digest: ${{ steps.antithesis-push.outputs.digest }}
          push-to-registry: true
      - name: Attest antithesis GHCR image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.antithesis-push.outputs.digest }}
          push-to-registry: true

  build-image-manifest:
    name: build-image-manifest
    needs: [build-images]
    # build-images overrides its skipped release-only dependency on main; this
    # job must also override that propagated skip before checking its result.
    if: always() && needs.build-images.result == 'success'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - id: antithesis-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-antithesis
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: manifest-create
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          ANTITHESIS_IMAGE_TAGS: ${{ steps.antithesis-meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker buildx imagetools create \
              --tag "$image_tag" \
              "${image_tag}-amd64" \
              "${image_tag}-arm64"
          done <<< "$IMAGE_TAGS"
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker buildx imagetools create \
              --tag "$image_tag" \
              "${image_tag}-amd64" \
              "${image_tag}-arm64"
          done <<< "$ANTITHESIS_IMAGE_TAGS"
      # Checkout repo so README.md is available for next step
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      # Update Docker Hub from README
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0 https://github.com/peter-evans/dockerhub-description/releases/tag/v5.0.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: blinklabs/${{ env.APPLICATION_NAME }}
          readme-filepath: ./README.md
          short-description: "Dingo is a Cardano blockchain data node"

  finalize-release:
    name: finalize-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    needs:
      - create-draft-release
      - build-linux
      - build-macos
      - build-images
      - build-image-manifest
    if: >-
      always()
      && github.ref_type == 'tag'
      && needs.create-draft-release.result == 'success'
      && needs.build-linux.result == 'success'
      && needs.build-macos.result == 'success'
      && needs.build-images.result == 'success'
      && needs.build-image-manifest.result == 'success'
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-draft-release.outputs.RELEASE_ID }},
                draft: false,
              });
            } catch (error) {
              core.setFailed(error.message);
            }

      # Requesting the tag's .info from the module proxy makes it fetch the new
      # version, which is also what pkg.go.dev indexes. Bounded and non-fatal:
      # the release is already published, and the proxy fetches on first use.
      - name: Refresh Go module proxy
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: >-
          curl --fail --silent --show-error --max-time 30
          --retry 3 --retry-max-time 120
          "https://proxy.golang.org/github.com/blinklabs-io/dingo/@v/${TAG}.info"

  npm-release:
    runs-on: ubuntu-latest
    needs: [finalize-release, validate-release-tag]
    if: >-
      github.ref_type == 'tag'
      && !contains(github.ref_name, '-')
      && !contains(github.ref_name, '+')
      && needs.finalize-release.result == 'success'
      && needs.validate-release-tag.result == 'success'
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.release_tag }}
      PACKAGE_VERSION: ${{ needs.validate-release-tag.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI for trusted publishing
        run: npm install --global npm@11.5.1
      - name: Stamp package version
        run: >-
          npm version "${PACKAGE_VERSION}" --no-git-tag-version
          --ignore-scripts --allow-same-version
      - name: Embed finalized release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/dingo-release-assets"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$asset_dir" --pattern "dingo-${RELEASE_TAG}-*.tar.gz"
          ASSET_DIR="$asset_dir" node npm/generate-checksums.js
      - name: Validate package installation and invocation
        run: npm test
      - name: Validate finalized release asset
        run: |
          set -euo pipefail
          archive="$(npm pack --silent)"
          install_root="$(mktemp -d)"
          trap 'rm -rf "$install_root" "$archive"' EXIT
          npm install --prefix "$install_root" --no-audit --no-fund "./$archive"
          "$install_root/node_modules/.bin/dingo" --help >/dev/null
      - name: Publish to NPM
        run: npm publish --access public
