name: publish

on:
  push:
    branches: ['main']
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a tag release after publication has started. Branch image
  # builds can be superseded by a newer main push.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  APPLICATION_NAME: 'dingo'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # Release validation happens before creating the draft release. Main pushes
  # publish images and binaries without paying for the full test suite.
  ci:
    name: ci (Linux)
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dingo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
          MYSQL_DATABASE: dingo_test
        options: >-
          --health-cmd "sh -c 'mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      minio:
        image: blinklabs/minio:main
        options: >-
          --health-cmd "curl localhost:9000"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
          - 9001:9001
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: dingo_test
      MYSQL_HOST: localhost
      MYSQL_PORT: '3306'
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_DATABASE: dingo_test
      MYSQL_ROOT_PASSWORD: mysql
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: "http://127.0.0.1:9000/"
      AWS_REGION: us-east-1
      DINGO_TEST_S3_BUCKET: dingo-test
    steps:
      - name: setup-s3-bucket
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --endpoint-url "$AWS_ENDPOINT" s3api create-bucket --bucket "$DINGO_TEST_S3_BUCKET"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
      - name: go-build
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - name: go-build-minimal
        run: go build ./cmd/dingo
      - name: go-test
        run: go test -tags dingo_extra_plugins -ldflags="-s -w" -race -timeout 20m ./...
      - name: govulncheck
        run: make govulncheck

  create-draft-release:
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref_type == 'tag' && needs.ci.result == 'success'
    permissions:
      contents: write
    outputs:
      RELEASE_ID: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        id: create-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {...release, per_page: 100},
            );
            const matching = releases.filter(
              candidate => candidate.tag_name === process.env.RELEASE_TAG,
            );
            const published = matching.find(candidate => !candidate.draft);

            if (published) {
              throw new Error(
                `release ${process.env.RELEASE_TAG} is already published; ` +
                'refusing to delete it',
              );
            }

            for (const draft of matching) {
              await github.rest.repos.deleteRelease({
                owner: release.owner,
                repo: release.repo,
                release_id: draft.id,
              });
            }

            const response = await github.rest.repos.createRelease({
              draft: true,
              generate_release_notes: true,
              name: process.env.RELEASE_TAG,
              owner: release.owner,
              prerelease: false,
              repo: release.repo,
              tag_name: process.env.RELEASE_TAG,
            });

            return response.data.id;

  # Run the platform-specific suite only after Linux release validation and
  # draft creation have succeeded.
  go-test-other:
    # Deliberately unnamed, so GitHub generates `go-test-other (<platform>,
    # <go-version>)`. A custom `name:` carrying matrix references collided with
    # go-test-platforms.yml, which renders the same string on a tag, and branch
    # protection matches a check by name — two workflows claiming one context
    # make a required check ambiguous. It also rendered literally as
    # `go-test (${{ matrix.platform }}) (${{ matrix.go-version }})` on every
    # non-tag push, because this job is skipped there and a skipped matrix job
    # never expands its matrix.
    needs: [ci, create-draft-release]
    # The only job in this workflow without an explicit grant, so it inherited
    # repository or organization defaults. It builds and runs tests and needs
    # nothing else; matches build-image-manifest's read-only grant.
    permissions:
      contents: read
    if: always() && github.ref_type == 'tag' && needs.ci.result == 'success' && needs.create-draft-release.result == 'success'
    strategy:
      matrix:
        go-version: [1.26.x]
        platform: [macos-latest, windows-latest]
        include:
          - platform: macos-latest
            cache_path: ~/Library/Caches/go-build
          - platform: windows-latest
            cache_path: ~\AppData\Local\go-build
    runs-on: ${{ matrix.platform }}
    # Generous on purpose. Hang protection comes from the per-package
    # `-timeout 20m` below; this cap only has to exceed a legitimate full-suite
    # run, which here means checkout, setup-go, a build, and `go test ./...`
    # across 100+ packages on a slower runner. The equivalent Linux job sets no
    # job cap at all, so a tight one here is the outlier and would fail
    # `go-test-other` with no single stuck package, blocking build-binaries and
    # finalize-release.
    timeout-minutes: 90
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ${{ matrix.cache_path }}
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build ./cmd/dingo
      - name: go-test
        # Windows runners are substantially slower for this suite. Keep the
        # same link-size optimization and explicit package timeout used by the
        # Linux release validation job, and cap the job so a stuck test cannot
        # hold the release indefinitely.
        run: go test -ldflags="-s -w" -timeout 20m ./...

  build-binaries:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            os: darwin
            arch: arm64
          - runner: ubuntu-latest
            os: freebsd
            arch: amd64
          - runner: ubuntu-latest
            os: freebsd
            arch: arm64
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-latest
            os: linux
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-latest
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    needs: [create-draft-release, go-test-other]
    if: always() && (github.ref_type != 'tag' || (needs.create-draft-release.result == 'success' && needs.go-test-other.result == 'success'))
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ${{ runner.os == 'macOS' && '~/Library/Caches/go-build' || runner.os == 'Windows' && '~\\AppData\\Local\\go-build' || '~/.cache/go-build' }}
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: Build binary
        run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} make build
        shell: bash
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_OS: ${{ matrix.os }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          _binary_name="$APPLICATION_NAME"
          if [ "$MATRIX_OS" = "windows" ]; then
            _binary_name="${APPLICATION_NAME}.exe"
          fi
          _filename="${APPLICATION_NAME}-${RELEASE_TAG}-${MATRIX_OS}-${MATRIX_ARCH}.tar.gz"
          tar czf "$_filename" "$_binary_name"
          curl \
            -H "Authorization: token $RELEASE_UPLOAD_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${_filename}" \
            "https://uploads.github.com/repos/${REPOSITORY_OWNER}/${APPLICATION_NAME}/releases/${RELEASE_ID}/assets?name=${_filename}"
        shell: bash
      - name: Attest binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: "${{ matrix.os == 'windows' && format('{0}.exe', env.APPLICATION_NAME) || env.APPLICATION_NAME }}"

  build-images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    needs: [create-draft-release, go-test-other]
    if: always() && (github.ref_type != 'tag' || (needs.create-draft-release.result == 'success' && needs.go-test-other.result == 'success'))
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build images
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          outputs: "type=registry,push=true"
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
      - name: Attest Docker Hub image
        continue-on-error: ${{ github.ref_type != 'tag' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: docker.io/blinklabs/dingo
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest GHCR image
        continue-on-error: ${{ github.ref_type != 'tag' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Antithesis instrumented image (amd64 only, reuses build cache)
      - id: antithesis-meta
        if: matrix.arch == 'amd64'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-antithesis
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build and push antithesis image
        if: matrix.arch == 'amd64'
        id: antithesis-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          outputs: "type=registry,push=true"
          platforms: linux/amd64
          target: antithesis
          tags: ${{ steps.antithesis-meta.outputs.tags }}
          labels: ${{ steps.antithesis-meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
      - name: Attest antithesis Docker Hub image
        if: matrix.arch == 'amd64'
        continue-on-error: ${{ github.ref_type != 'tag' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: docker.io/blinklabs/dingo
          subject-digest: ${{ steps.antithesis-push.outputs.digest }}
          push-to-registry: true
      - name: Attest antithesis GHCR image
        if: matrix.arch == 'amd64'
        continue-on-error: ${{ github.ref_type != 'tag' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.antithesis-push.outputs.digest }}
          push-to-registry: true

  build-image-manifest:
    needs: [build-images]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: manifest-create
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker buildx imagetools create \
              --tag "$image_tag" \
              "${image_tag}-amd64" \
              "${image_tag}-arm64"
          done <<< "$IMAGE_TAGS"
      # Checkout repo so README.md is available for next step
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      # Update Docker Hub from README
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0 https://github.com/peter-evans/dockerhub-description/releases/tag/v5.0.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: blinklabs/${{ env.APPLICATION_NAME }}
          readme-filepath: ./README.md
          short-description: "Dingo is a Cardano blockchain data node"

  finalize-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [create-draft-release, go-test-other, build-binaries, build-images, build-image-manifest]
    if: always() && github.ref_type == 'tag' && needs.create-draft-release.result == 'success' && needs.go-test-other.result == 'success' && needs.build-binaries.result == 'success' && needs.build-images.result == 'success' && needs.build-image-manifest.result == 'success'
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-draft-release.outputs.RELEASE_ID }},
                draft: false,
              });
            } catch (error) {
              core.setFailed(error.message);
            }

      # This updates the documentation on pkg.go.dev and the latest version available via the Go module proxy
      ### TODO: this is broken
      #- name: Pull new module version
      #  if: startsWith(github.ref, 'refs/tags/')
      #  uses: andrewslotin/go-proxy-pull-action@e5aea3b8b3478fc5b76befda4390513868ed2dc8 # v1.4.0 https://github.com/andrewslotin/go-proxy-pull-action/releases/tag/v1.4.0

  # Bump the dingo formula in the blinklabs-io/homebrew-cardano tap.
  #
  # Deliberately NON-BLOCKING: it runs only after the release is fully
  # published, nothing depends on it, and `continue-on-error: true` keeps the
  # workflow green even if the tap PR cannot be opened. A broken tap must never
  # hold back a shipped release.
  #
  # Authenticates to the tap with the org-level ORG_PROJECT_PAT secret, a token
  # with `contents: write` and `pull-requests: write` on
  # blinklabs-io/homebrew-cardano. The default GITHUB_TOKEN only scopes to this
  # repository and cannot push a branch or open a PR on the tap. When the secret
  # is absent (e.g. forks), the job no-ops instead of failing.
  update-homebrew:
    runs-on: ubuntu-latest
    needs: [finalize-release]
    if: always() && github.ref_type == 'tag' && needs.finalize-release.result == 'success'
    continue-on-error: true
    permissions:
      contents: read
    env:
      TAP_REPO: blinklabs-io/homebrew-cardano
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.ORG_PROJECT_PAT }}
    steps:
      - name: Check tap token
        id: gate
        run: |
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN}" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not set; skipping homebrew tap update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute release facts
        id: facts
        if: steps.gate.outputs.enabled == 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tarball_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          # GitHub source tarballs for a tag are byte-stable, so this sha256
          # pins the exact release the formula builds from.
          sha256="$(curl -fsSL "$tarball_url" | sha256sum | cut -d' ' -f1)"
          {
            echo "tarball_url=$tarball_url"
            echo "sha256=$sha256"
            # Match the release build convention (Makefile derives COMMIT_HASH
            # from `git rev-parse --short HEAD`, i.e. 7 chars) so the Homebrew
            # build stamps the same version.CommitHash as the released binaries.
            echo "short_commit=${COMMIT_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout homebrew tap
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ env.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
      - name: Update formula
        if: steps.gate.outputs.enabled == 'true'
        env:
          TARBALL_URL: ${{ steps.facts.outputs.tarball_url }}
          SHA256: ${{ steps.facts.outputs.sha256 }}
          SHORT_COMMIT: ${{ steps.facts.outputs.short_commit }}
        run: |
          set -euo pipefail
          formula="homebrew-tap/Formula/dingo.rb"
          # Move the three release-pinned fields together, exactly as the
          # formula documents: the source tarball url, its sha256, and the
          # CommitHash stamped into the version package (version.Version comes
          # from the formula's own #{version}, so it needs no edit here).
          sed -i -E \
            -e "s#^  url \".*\"#  url \"${TARBALL_URL}\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"${SHA256}\"#" \
            -e "s#(version\.CommitHash=)[0-9a-f]+#\1${SHORT_COMMIT}#" \
            "$formula"
          # sed exits 0 even when a pattern matches nothing. If the tap renames
          # a field or changes its indentation a substitution silently no-ops,
          # the next step sees a clean tree and ships a stale formula. Assert
          # each expected value is present so a missed edit fails the job loudly.
          for expected in "${TARBALL_URL}" "${SHA256}" "version.CommitHash=${SHORT_COMMIT}"; do
            if ! grep -qF -- "$expected" "$formula"; then
              echo "::error::formula field not updated: $expected"
              exit 1
            fi
          done
          echo "::group::Updated formula"
          cat "$formula"
          echo "::endgroup::"
      - name: Open tap pull request
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd homebrew-tap
          if git diff --quiet -- Formula/dingo.rb; then
            echo "Formula already up to date for ${RELEASE_TAG}; nothing to do."
            exit 0
          fi
          branch="dingo-${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add Formula/dingo.rb
          git commit -m "dingo ${RELEASE_TAG}"
          # A retried tag run may find the tap branch already on the remote. The
          # tap was checked out on its default branch, so there is no
          # origin/$branch tracking ref for --force-with-lease to compare
          # against and the push would be rejected as stale. Fetch the existing
          # branch first so the lease has a real base to check.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          fi
          git push --force-with-lease origin "$branch"
          # Reuse an existing open PR for this tag if a prior run created one.
          if [ -z "$(gh pr list --repo "$TAP_REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
              --title "dingo ${RELEASE_TAG}" \
              --body "Automated formula bump for [dingo ${RELEASE_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})."
          else
            echo "Open PR already exists for ${branch}; pushed updated formula to it."
          fi
