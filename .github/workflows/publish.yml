name: publish

# The main and release pipeline. It carries the same stages as the
# pull-request pipeline in go-test.yml, in the same order, and adds the
# publishing jobs after them:
#
#   lint, govulncheck                     2 runners, ~3 min
#     -> go-test (Linux, quick)           1 runner,  ~8 min
#       -> go-test (Linux)
#          go-test (Linux, race)
#          go-test (Windows)
#          go-test (macOS)               4 runners, 5-35 min
#         -> create-draft-release        tag only, needs all four
#         -> build-<os>, build-images    gated on the SAME OS's tests
#           -> build-image-manifest
#             -> finalize-release        tag only
#
# A push to main runs this workflow and nothing else: go-test.yml is
# pull-request only. Previously a merge started go-test.yml's five jobs and
# this workflow's ten independently, sixteen runners at once, and the images
# and binaries published without waiting for any of them. Now the same merge
# peaks at about five concurrent jobs and nothing is pushed until the tests
# that cover it are green.
#
# The difference between a main push and a release tag is signing and
# publishing the final artifacts. Both run every stage above and both push
# branch- or version-tagged images; only a tag creates a GitHub release,
# uploads binary archives, attests them, and finalizes the release.
#
# The stages are duplicated from go-test.yml rather than factored into a
# reusable workflow, because `needs:` cannot cross workflow files and a called
# workflow would rename every check context. internal/docsparity's
# TestPipelineStagesMatch fails when the two files drift.

on:
  push:
    branches: ['main']
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  # Main runs build images and binaries but do not publish release artifacts.
  # Give each main run its own group so a newer push cannot cancel the
  # backstop for an earlier merged commit. Keep every other ref serialized, so
  # re-pushing a tag cannot run two publications at once.
  #
  # Grouping main pushes by ref instead, so a newer merge supersedes an older
  # one, is what this repository ran before #4458 and moved away from: GitHub
  # keeps at most one pending run per group and cancels the earlier pending
  # one, so in a burst of merges the intermediate commits are skipped rather
  # than tested, and 8 of 10 main runs ended cancelled. What protects the
  # runner queue is the staging above instead, which cuts a merge's peak from
  # sixteen concurrent jobs to about five.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  # Never interrupt a tag release after publication has started.
  cancel-in-progress: false

env:
  APPLICATION_NAME: 'dingo'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # Stage 1. See go-test.yml's lint job for why these are steps of one job
  # rather than a matrix, and why internal/docsparity derives the module list
  # from the tree.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
      - name: golangci-lint (internal/test/antithesis)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
        with:
          working-directory: internal/test/antithesis
      - name: golangci-lint (examples/dingo-gov-lens)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
        with:
          working-directory: examples/dingo-gov-lens
      - name: golangci-lint (root, GOOS=windows)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
        env:
          GOOS: windows
      - name: config-parity
        run: make config-parity

  # Stage 1, alongside lint. Not a dependency of anything: a new advisory
  # landing upstream must not block publication while it is triaged. It still
  # fails the run.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          # This job runs `go run ...@latest`, so third-party code executes in
          # the workspace. Do not leave GITHUB_TOKEN in the local git config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: govulncheck
        run: make govulncheck

  # Stage 2. The cheap gate: whole suite on SQLite, no race, no services.
  # Decides whether it is worth spending four runners on the stage below.
  go-test-linux-quick:
    name: go-test (Linux, quick)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: go-build
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - name: go-build-minimal
        run: go build ./cmd/dingo
      - name: sqlc-generation-drift
        run: make sql-check
      - name: go-test
        run: go test -tags dingo_extra_plugins -ldflags="-s -w" -timeout 30m ./...

  # Stage 3. Linux with Postgres, MySQL and MinIO (fake s3) services. Keeps
  # the real PostgreSQL, MySQL and S3 coverage that the release gate has
  # always had, uninstrumented: the conformance package alone approaches the
  # 30m package timeout when PostgreSQL and MySQL run alongside SQLite under
  # -race, so service-backed coverage and race coverage are separate jobs.
  go-test-linux:
    name: go-test (Linux)
    needs: [go-test-linux-quick]
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dingo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
          MYSQL_DATABASE: dingo_test
        options: >-
          --health-cmd "sh -c 'mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      minio:
        image: blinklabs/minio:main
        options: >-
          --health-cmd "curl localhost:9000"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000
          - 9001:9001
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: dingo_test
      MYSQL_HOST: localhost
      MYSQL_PORT: '3306'
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_DATABASE: dingo_test
      MYSQL_ROOT_PASSWORD: mysql
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: "http://127.0.0.1:9000/"
      AWS_REGION: us-east-1
      DINGO_TEST_S3_BUCKET: dingo-test
    steps:
      - name: setup-s3-bucket
        run: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install --update
            aws --endpoint-url "$AWS_ENDPOINT" s3api create-bucket --bucket "$DINGO_TEST_S3_BUCKET"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - name: install-mariadb-client
        # See go-test.yml: mysqlSSLArgs targets the MariaDB client the runtime
        # image ships, which ubuntu-latest's preinstalled mysqldump is not.
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
          mysqldump --version
      - name: sqlstore-database-integration
        env:
          DINGO_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/dingo_test?sslmode=disable
          DINGO_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/dingo_test?parseTime=true
        run: >-
          go test -tags 'dingo_extra_plugins dingo_db_integration'
          ./database/plugin/metadata/sqlstore
          ./database/plugin/metadata/postgres
          ./database/plugin/metadata/mysql
          -timeout 10m
      - name: go-test-live-lifecycle
        run: make test-live-lifecycle
      - name: go-test
        run: go test -v -tags dingo_extra_plugins -ldflags="-s -w" -timeout 30m ./...

  # Stage 3. Optional service backends are deliberately unconfigured here, so
  # internal/test/conformance replays its vectors against SQLite only. Same
  # command as go-test.yml's race job, so a pull request cannot pass a check
  # the release then fails.
  go-test-linux-race:
    name: go-test (Linux, race)
    needs: [go-test-linux-quick]
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-race-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-${{ matrix.go-version }}-
      - name: go-build
        run: go build -tags dingo_extra_plugins ./cmd/dingo
      - name: go-test-race
        run: go test -v -tags dingo_extra_plugins -ldflags="-s -w" -race -timeout 30m ./...

  # Stage 3. Platform coverage on the merge and release path, not only on a
  # pull request: a merge conflict, a stale base, or a force-push can land a
  # tree no pull request ever tested on these platforms.
  go-test-windows:
    name: go-test (Windows)
    needs: [go-test-linux-quick]
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build ./...
      - name: go-test
        run: go test -v -ldflags="-s -w" -timeout 30m ./...

  go-test-macos:
    name: go-test (macOS)
    needs: [go-test-linux-quick]
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: go-build
        run: go build ./...
      - name: go-test
        run: go test -v -ldflags="-s -w" -timeout 30m ./...

  # A release draft is created only once every platform is green, so a tag
  # cannot reach a half-published state the way v0.70.3 did.
  create-draft-release:
    name: create-draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - go-test-linux
      - go-test-linux-race
      - go-test-windows
      - go-test-macos
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    outputs:
      RELEASE_ID: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        id: create-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {...release, per_page: 100},
            );
            const matching = releases.filter(
              candidate => candidate.tag_name === process.env.RELEASE_TAG,
            );
            const published = matching.find(candidate => !candidate.draft);

            if (published) {
              throw new Error(
                `release ${process.env.RELEASE_TAG} is already published; ` +
                'refusing to delete it',
              );
            }

            for (const draft of matching) {
              await github.rest.repos.deleteRelease({
                owner: release.owner,
                repo: release.repo,
                release_id: draft.id,
              });
            }

            const response = await github.rest.repos.createRelease({
              draft: true,
              generate_release_notes: true,
              name: process.env.RELEASE_TAG,
              owner: release.owner,
              prerelease: false,
              repo: release.repo,
              tag_name: process.env.RELEASE_TAG,
            });

            return response.data.id;

  # Stage 4. One build job per runner OS, each gated on that OS's own tests,
  # replacing a 7-entry matrix of one-target jobs. See
  # .github/scripts/build-targets.sh.
  #
  # On a tag these also wait for create-draft-release, because the archives
  # they produce are uploaded to that draft. On a main push there is no draft
  # and no upload: the binaries are built as a cross-compilation check and
  # discarded, which is the whole of the difference between main and a release
  # for this stage.
  #
  # `always()` is required because create-draft-release is skipped on a main
  # push, and a skipped dependency would otherwise skip these too. Each test
  # dependency is then checked explicitly, or a failed one would pass the
  # guard.
  build-linux:
    name: build (Linux)
    needs: [go-test-linux, go-test-linux-race, create-draft-release]
    if: >-
      always()
      && needs.go-test-linux.result == 'success'
      && needs.go-test-linux-race.result == 'success'
      && (github.ref_type != 'tag' || needs.create-draft-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: Build binaries
        env:
          BUILD_TARGETS: linux/amd64 linux/arm64 freebsd/amd64 freebsd/arm64
          # Empty on a main push, which tells the script to skip packaging.
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/build-targets.sh
      - name: Upload release assets
        if: github.ref_type == 'tag'
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-release-assets.sh
      - name: Attest binaries
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: dist/*/${{ env.APPLICATION_NAME }}

  build-windows:
    name: build (Windows)
    needs: [go-test-windows, create-draft-release]
    if: >-
      always()
      && needs.go-test-windows.result == 'success'
      && (github.ref_type != 'tag' || needs.create-draft-release.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: Build binaries
        env:
          BUILD_TARGETS: windows/amd64 windows/arm64
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/build-targets.sh
        shell: bash
      - name: Upload release assets
        if: github.ref_type == 'tag'
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-release-assets.sh
        shell: bash
      - name: Attest binaries
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: dist/*/${{ env.APPLICATION_NAME }}.exe

  build-macos:
    name: build (macOS)
    needs: [go-test-macos, create-draft-release]
    if: >-
      always()
      && needs.go-test-macos.result == 'success'
      && (github.ref_type != 'tag' || needs.create-draft-release.result == 'success')
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-1.26.x-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.x-
      - name: Build binaries
        env:
          BUILD_TARGETS: darwin/arm64
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/build-targets.sh
      - name: Upload release assets
        if: github.ref_type == 'tag'
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-release-assets.sh
      - name: Attest binaries
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: dist/*/${{ env.APPLICATION_NAME }}

  # Stage 4. Images are linux artifacts, so they gate on the Linux tests.
  # Attestation is signing, which is why it is tag-only: a main push publishes
  # a branch-tagged image and stops there. Previously these attestations ran
  # on main under continue-on-error, which meant a main push both attested and
  # ignored the result.
  build-images:
    name: build-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    needs: [go-test-linux, go-test-linux-race, create-draft-release]
    if: >-
      always()
      && needs.go-test-linux.result == 'success'
      && needs.go-test-linux-race.result == 'success'
      && (github.ref_type != 'tag' || needs.create-draft-release.result == 'success')
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build images
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          outputs: "type=registry,push=true"
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
      - name: Attest Docker Hub image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: docker.io/blinklabs/dingo
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest GHCR image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Antithesis instrumented image (amd64 only, reuses build cache)
      - id: antithesis-meta
        if: matrix.arch == 'amd64'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-antithesis
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build and push antithesis image
        if: matrix.arch == 'amd64'
        id: antithesis-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          outputs: "type=registry,push=true"
          platforms: linux/amd64
          target: antithesis
          tags: ${{ steps.antithesis-meta.outputs.tags }}
          labels: ${{ steps.antithesis-meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
      - name: Attest antithesis Docker Hub image
        if: matrix.arch == 'amd64' && github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: docker.io/blinklabs/dingo
          subject-digest: ${{ steps.antithesis-push.outputs.digest }}
          push-to-registry: true
      - name: Attest antithesis GHCR image
        if: matrix.arch == 'amd64' && github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.antithesis-push.outputs.digest }}
          push-to-registry: true

  build-image-manifest:
    name: build-image-manifest
    needs: [build-images]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.3.0
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: manifest-create
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker buildx imagetools create \
              --tag "$image_tag" \
              "${image_tag}-amd64" \
              "${image_tag}-arm64"
          done <<< "$IMAGE_TAGS"
      # Checkout repo so README.md is available for next step
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      # Update Docker Hub from README
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0 https://github.com/peter-evans/dockerhub-description/releases/tag/v5.0.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: blinklabs/${{ env.APPLICATION_NAME }}
          readme-filepath: ./README.md
          short-description: "Dingo is a Cardano blockchain data node"

  finalize-release:
    name: finalize-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    needs:
      - create-draft-release
      - build-linux
      - build-windows
      - build-macos
      - build-images
      - build-image-manifest
    if: >-
      always()
      && github.ref_type == 'tag'
      && needs.create-draft-release.result == 'success'
      && needs.build-linux.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.build-macos.result == 'success'
      && needs.build-images.result == 'success'
      && needs.build-image-manifest.result == 'success'
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-draft-release.outputs.RELEASE_ID }},
                draft: false,
              });
            } catch (error) {
              core.setFailed(error.message);
            }

      # This updates the documentation on pkg.go.dev and the latest version available via the Go module proxy
      ### TODO: this is broken
      #- name: Pull new module version
      #  if: startsWith(github.ref, 'refs/tags/')
      #  uses: andrewslotin/go-proxy-pull-action@e5aea3b8b3478fc5b76befda4390513868ed2dc8 # v1.4.0 https://github.com/andrewslotin/go-proxy-pull-action/releases/tag/v1.4.0
