name: publish

# The main and release pipeline. It runs no tests: every commit on main is the
# commit the merge queue already tested in go-test.yml's tier-2 gates, and the
# merge queue fast-forwards main to exactly that commit.
#
#   main push:  build-images -> build-image-manifest
#   tag:        validate-release-tag, govulncheck, verify-tested
#                 -> create-draft-release
#                   -> build-linux, build-macos, build-images
#                     -> build-image-manifest
#                       -> finalize-release -> npm-release
#
# A main push publishes branch-tagged images and stops there; it used to re-run
# every test stage of the pull-request pipeline first, ~171 runner-minutes per
# merge on top of what the pull request had already spent. A tag additionally
# signs and publishes: it creates the GitHub release, uploads binary archives
# and the conformance reports, attests the binaries, and finalizes the release.
#
# verify-tested is what keeps a release from publishing a commit no gate
# covered -- the v0.70.3 failure, where a race-detector failure surfaced with
# the tag already pushed. It requires a successful gate (race), gate
# (services), gate (macOS) and gate (build) check run on the tagged commit.
# The merge queue leaves those on every commit it lands; for a commit that did
# not come through the queue, dispatch the ci workflow on it first.

on:
  push:
    branches: ['main']
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  # One group per ref. On main a newer push cancels the run it supersedes:
  # main runs only publish the branch-tagged images, which the next run
  # overwrites anyway, so a burst of merges builds them once instead of once
  # per commit. Every main commit is tested in the merge queue before it lands,
  # so skipping an intermediate commit's images loses no coverage. A burst of
  # 13 direct merges once started 13 runs that held 15 of the organization's
  # 20 runners at the same time.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a tag release after publication has started.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  APPLICATION_NAME: 'dingo'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # A tag cannot publish while govulncheck is failing. This was lost once
  # already, when splitting the old `ci` job into stages dropped its implicit
  # edge to create-draft-release and nothing failed. It does not gate the
  # main-push path: a new advisory landing upstream must not block every
  # merge in the repository while it is triaged.
  govulncheck:
    name: govulncheck
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          # This job runs a checksum-pinned third-party scanner in
          # the workspace. Do not leave GITHUB_TOKEN in the local git config.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - name: govulncheck
        run: make govulncheck

  # A release publishes only a commit every tier-2 gate passed. Reading the
  # check runs GitHub Actions left on the commit costs one API call per gate
  # instead of re-running ~135 runner-minutes of tests.
  verify-tested:
    name: verify-tested
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - name: Require passing tier-2 gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          failed=0
          conclusion_of() {
            gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs" \
              -f check_name="$1" -f filter=latest \
              --jq '[.check_runs[] | select(.app.slug == "github-actions") | .conclusion] | first // "missing"'
          }
          # The merge queue skips every gate for a documentation-only group
          # and records that its changes job succeeded. A skipped gate on a
          # commit that never went through the queue has no such record.
          changes="$(conclusion_of changes)"
          echo "changes: ${changes}"
          for gate in 'gate (race)' 'gate (services)' 'gate (macOS)' 'gate (build)'; do
            conclusion="$(conclusion_of "$gate")"
            echo "${gate}: ${conclusion}"
            if [ "$conclusion" = skipped ] && [ "$changes" = success ]; then
              continue
            fi
            if [ "$conclusion" != success ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::${COMMIT_SHA} has not passed every tier-2 gate; land it through the merge queue or dispatch the ci workflow on it, then re-run this job" >&2
            exit 1
          fi

  validate-release-tag:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      package_version: ${{ steps.validate.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        id: validate
        env:
          CANDIDATE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(.github/scripts/validate-release-tag.sh "$CANDIDATE_RELEASE_TAG")"
          {
            echo "release_tag=$CANDIDATE_RELEASE_TAG"
            echo "package_version=$package_version"
          } >> "$GITHUB_OUTPUT"

  create-draft-release:
    name: create-draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The draft is created only once the commit is known to be tested and
    # clean, so a tag cannot reach a half-published state the way v0.70.3 did.
    needs:
      - govulncheck
      - verify-tested
      - validate-release-tag
    if: >-
      github.ref_type == 'tag'
      && needs.validate-release-tag.result == 'success'
    permissions:
      contents: write
    outputs:
      RELEASE_ID: ${{ steps.create-release.outputs.result }}
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.release_tag }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        id: create-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {...release, per_page: 100},
            );
            const matching = releases.filter(
              candidate => candidate.tag_name === process.env.RELEASE_TAG,
            );
            const published = matching.find(candidate => !candidate.draft);

            if (published) {
              throw new Error(
                `release ${process.env.RELEASE_TAG} is already published; ` +
                'refusing to delete it',
              );
            }

            for (const draft of matching) {
              await github.rest.repos.deleteRelease({
                owner: release.owner,
                repo: release.repo,
                release_id: draft.id,
              });
            }

            const response = await github.rest.repos.createRelease({
              draft: true,
              generate_release_notes: true,
              name: process.env.RELEASE_TAG,
              owner: release.owner,
              prerelease: false,
              repo: release.repo,
              tag_name: process.env.RELEASE_TAG,
            });

            return response.data.id;

  # The release binaries, one job per runner OS, replacing a 7-entry matrix of
  # one-target jobs. See .github/scripts/build-targets.sh. Tag only: the
  # archives are uploaded to the draft release. A main push builds no
  # binaries, because the merge queue's gate (build) already cross-compiled
  # every target from the same commit.
  build-linux:
    name: build (Linux)
    needs: [create-draft-release]
    if: >-
      github.ref_type == 'tag'
      && needs.create-draft-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBOR_DATASET_REVISION: '6cd8c928665bbafe90e02066ebb4620e38f051de'
      NDC_LEDGER_REVISION: 'e02a9e1c7dc15cc6d618c7ffdbd41167a38de2a4'
      UPLC_CORPUS_SHA256: '8bd4ad4f9f4c8c6b8ffa1f06ed1db0b43043afbba77ef6a14bcfb5a52345ed3f'
      TURBO_CORPUS_SHA256: '821af55e3323c826b5598c964d634b46dd468014834d0e97ebdc5edb0a158576'
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-1.26.10-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.10-
      - name: Build binaries
        env:
          BUILD_TARGETS: linux/amd64 linux/arm64 freebsd/amd64 freebsd/arm64
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/build-targets.sh
      - name: Checkout CBOR conformance corpus
        if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          repository: r2rationality/cardano-cbor-dataset
          ref: ${{ env.CBOR_DATASET_REVISION }}
          path: .conformance/cardano-cbor-dataset
          persist-credentials: false
      - name: Checkout ledger-rules fixtures
        if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          repository: pragma-org/node-diversity-conformance
          ref: ${{ env.NDC_LEDGER_REVISION }}
          path: .conformance/node-diversity-conformance
          sparse-checkout: scenarios/ledger-rules/fixtures
          persist-credentials: false
      - name: Generate conformance reports
        if: github.ref_type == 'tag'
        timeout-minutes: 60
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CBOR_DATASET_DIR: .conformance/cardano-cbor-dataset
        run: .github/scripts/generate-conformance-reports.sh
      - name: Upload release assets
        if: github.ref_type == 'tag'
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_CONFORMANCE_REPORT: 'true'
        run: .github/scripts/upload-release-assets.sh
      - name: Attest binaries
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: dist/*/${{ env.APPLICATION_NAME }}

  build-macos:
    name: build (macOS)
    needs: [create-draft-release]
    if: >-
      github.ref_type == 'tag'
      && needs.create-draft-release.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.10
          cache: false
      # Module downloads do not depend on -race, so one entry per OS serves
      # every job on it instead of a copy inside each build cache. The
      # cache version includes the resolved home directory, so Linux and
      # macOS cannot share one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        with:
          path: ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-1.26.10-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-1.26.10-
      - name: Build binaries
        env:
          BUILD_TARGETS: darwin/amd64 darwin/arm64
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: .github/scripts/build-targets.sh
      - name: Upload release assets
        if: github.ref_type == 'tag'
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-release-assets.sh
      - name: Attest binaries
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: dist/*/${{ env.APPLICATION_NAME }}

  # Images publish on every main push and every tag. On a tag they wait for
  # the draft release; `always()` is required because create-draft-release is
  # skipped on a main push, and a skipped dependency would otherwise skip
  # these too. Attestation is signing, which is why it is tag-only: a main push publishes
  # a branch-tagged image and stops there. Previously these attestations ran
  # on main under continue-on-error, which meant a main push both attested and
  # ignored the result.
  build-images:
    name: build-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    needs: [create-draft-release]
    if: >-
      always()
      && (github.ref_type != 'tag' || needs.create-draft-release.result == 'success')
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - run: git config --global --add safe.directory "$PWD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0 https://github.com/docker/login-action/releases/tag/v4.7.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0 https://github.com/docker/login-action/releases/tag/v4.7.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build images
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          outputs: "type=registry,push=true"
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
      - name: Attest Docker Hub image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: docker.io/blinklabs/dingo
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest GHCR image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - id: antithesis-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-antithesis-${{ matrix.arch }}
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build and push antithesis image
        id: antithesis-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          outputs: "type=registry,push=true"
          platforms: linux/${{ matrix.arch }}
          target: antithesis
          tags: ${{ steps.antithesis-meta.outputs.tags }}
          labels: ${{ steps.antithesis-meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT_HASH=${{ github.sha }}
      - name: Attest antithesis Docker Hub image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: docker.io/blinklabs/dingo
          subject-digest: ${{ steps.antithesis-push.outputs.digest }}
          push-to-registry: true
      - name: Attest antithesis GHCR image
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.antithesis-push.outputs.digest }}
          push-to-registry: true

  build-image-manifest:
    name: build-image-manifest
    needs: [build-images]
    # build-images overrides its skipped release-only dependency on main; this
    # job must also override that propagated skip before checking its result.
    if: always() && needs.build-images.result == 'success'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0 https://github.com/docker/login-action/releases/tag/v4.7.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0 https://github.com/docker/login-action/releases/tag/v4.7.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - id: antithesis-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/dingo
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-antithesis
          tags: |
            # Only version, no revision
            type=match,pattern=v(.*)-(.*),group=1
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: manifest-create
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          ANTITHESIS_IMAGE_TAGS: ${{ steps.antithesis-meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker buildx imagetools create \
              --tag "$image_tag" \
              "${image_tag}-amd64" \
              "${image_tag}-arm64"
          done <<< "$IMAGE_TAGS"
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker buildx imagetools create \
              --tag "$image_tag" \
              "${image_tag}-amd64" \
              "${image_tag}-arm64"
          done <<< "$ANTITHESIS_IMAGE_TAGS"
      # Checkout repo so README.md is available for next step
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      # Update Docker Hub from README
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0 https://github.com/peter-evans/dockerhub-description/releases/tag/v5.0.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: blinklabs/${{ env.APPLICATION_NAME }}
          readme-filepath: ./README.md
          short-description: "Dingo is a Cardano blockchain data node"

  finalize-release:
    name: finalize-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    needs:
      - create-draft-release
      - build-linux
      - build-macos
      - build-images
      - build-image-manifest
    if: >-
      always()
      && github.ref_type == 'tag'
      && needs.create-draft-release.result == 'success'
      && needs.build-linux.result == 'success'
      && needs.build-macos.result == 'success'
      && needs.build-images.result == 'success'
      && needs.build-image-manifest.result == 'success'
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-draft-release.outputs.RELEASE_ID }},
                draft: false,
              });
            } catch (error) {
              core.setFailed(error.message);
            }

      # Requesting the tag's .info from the module proxy makes it fetch the new
      # version, which is also what pkg.go.dev indexes. Bounded and non-fatal:
      # the release is already published, and the proxy fetches on first use.
      - name: Refresh Go module proxy
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: >-
          curl --fail --silent --show-error --max-time 30
          --retry 3 --retry-max-time 120
          "https://proxy.golang.org/github.com/blinklabs-io/dingo/@v/${TAG}.info"

  npm-release:
    runs-on: ubuntu-latest
    needs: [finalize-release, validate-release-tag]
    if: >-
      github.ref_type == 'tag'
      && !contains(github.ref_name, '-')
      && !contains(github.ref_name, '+')
      && needs.finalize-release.result == 'success'
      && needs.validate-release-tag.result == 'success'
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate-release-tag.outputs.release_tag }}
      PACKAGE_VERSION: ${{ needs.validate-release-tag.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI for trusted publishing
        run: npm install --global npm@11.5.1
      - name: Stamp package version
        run: >-
          npm version "${PACKAGE_VERSION}" --no-git-tag-version
          --ignore-scripts --allow-same-version
      - name: Embed finalized release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/dingo-release-assets"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$asset_dir" --pattern "dingo-${RELEASE_TAG}-*.tar.gz"
          ASSET_DIR="$asset_dir" node npm/generate-checksums.js
      - name: Validate package installation and invocation
        run: npm test
      - name: Validate finalized release asset
        run: |
          set -euo pipefail
          archive="$(npm pack --silent)"
          install_root="$(mktemp -d)"
          trap 'rm -rf "$install_root" "$archive"' EXIT
          npm install --prefix "$install_root" --no-audit --no-fund "./$archive"
          "$install_root/node_modules/.bin/dingo" --help >/dev/null
      - name: Publish to NPM
        run: npm publish --access public
