version: "2"
run:
  build-tags:
    - dingo_extra_plugins
  issues-exit-code: 1
  tests: false
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gomodguard_v2
    - gosec
    - gosmopolitan
    - loggercheck
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - perfsprint
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - unparam
    - usestdlibvars
    - whitespace
    - zerologlint
  disable:
    - depguard
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - docs
      - third_party$
      - builtin$
      - examples$
    rules:
      # database/txn.go's NewTxn/NewMetadataOnlyTxn are the documented,
      # deliberate propagation boundary between the sqlstore metadata store
      # (which now threads a caller ctx through Transaction/ReadTransaction)
      # and database.Database's own callers, which do not yet thread a ctx
      # into MetadataTxn/Transaction/BlocksRecent/etc. Extending ctx
      # propagation through database.Database's public API and its ~45
      # external callers is out of scope here; see ARCHITECTURE.md's
      # "Context propagation and cancellation" section.
      - linters:
          - contextcheck
        text: "->NewTxn` should pass the context parameter|->NewMetadataOnlyTxn` should pass the context parameter"
  settings:
    recvcheck:
      # UnmarshalJSON has to take a pointer to mutate the receiver, while
      # MarshalJSON conventionally takes a value so both a value and a pointer
      # satisfy json.Marshaler. Every type implementing the pair therefore
      # mixes receivers by design. Changing MarshalJSON to a pointer receiver
      # to satisfy the linter would mean a non-addressable value -- one in a
      # map, or passed by value to json.Marshal -- silently stops using the
      # custom marshaler and emits raw struct fields instead.
      exclusions:
        - "*.MarshalJSON"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - docs
      - third_party$
      - builtin$
      - examples$
