groups:
  - name: dingo
    rules:
      - alert: DingoBlockStall
        expr: changes(cardano_node_metrics_blockNum_int{network=~".+"}[5m]) == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Dingo block height stalled on {{ $labels.network }}"
          description: "Node {{ $labels.instance }} on {{ $labels.network }}: block height has not changed in 5 minutes."

      - alert: DingoSlotDrift
        expr: changes(cardano_node_metrics_slotNum_int{network=~".+"}[2m]) == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Dingo slot counter stalled on {{ $labels.network }}"
          description: "Node {{ $labels.instance }} on {{ $labels.network }}: slot counter has not advanced in 2 minutes."

      - alert: DingoPeerLoss
        expr: cardano_node_metrics_connectionManager_outgoingConns{network=~".+"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Dingo has no outgoing peers on {{ $labels.network }}"
          description: "Node {{ $labels.instance }} on {{ $labels.network }}: zero outgoing connections for 5+ minutes. Node cannot sync."

  # node-parity (blinklabs-io/dingo#1900): cross-node ledger-state
  # comparison against a reference cardano-node. See cmd/node-parity and
  # docs/dashboards/prometheus.yaml's node-parity/cardano-node-reference jobs.
  - name: node-parity
    rules:
      - alert: NodeParityDivergence
        # increase(), not the absolute counter value: the raw counter would
        # stay "> 0" forever after a single divergence, since a Counter
        # never decreases on its own -- increase() bounds that to roughly
        # the [1h] window instead. This does not fully insulate against a
        # metrics-server restart: Prometheus's counter-reset handling
        # extrapolates through a reset rather than discarding what came
        # before it, so a divergence recorded shortly before a restart can
        # still contribute to increase() for up to an hour afterwards.
        expr: increase(node_parity_divergence_total{network=~".+"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "node-parity found ledger-state divergence on {{ $labels.network }}"
          description: "node-parity ({{ $labels.instance }}) reported a {{ $labels.field }} divergence between dingo and cardano-node on {{ $labels.network }} in the last hour."

      - alert: NodeParityDown
        expr: up{job="node-parity"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node-parity is not reachable"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} (job node-parity) for 5+ minutes."

      - alert: NodeParityNotChecking
        # watch is block-triggered (a check fires the moment either node's
        # tip changes), with --fallback-interval (default 2m) as a backstop
        # if a watcher's subscription silently stalls -- so real activity
        # (completed or skipped) is expected roughly every block, and never
        # less often than the fallback interval. Sums checks_total
        # (completed) and checks_skipped_total (discarded, e.g. because the
        # two nodes didn't hold a stable common tip) rather than just
        # checks_total alone: a run of legitimate skips during a noisy
        # stretch must not look identical to a dead tool.
        expr: |
          (
            rate(node_parity_checks_total{network=~".+"}[10m])
            + sum without (reason) (rate(node_parity_checks_skipped_total{network=~".+"}[10m]))
          ) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node-parity has not attempted a check on {{ $labels.network }}"
          description: "{{ $labels.instance }} (job node-parity) has recorded neither a completed nor a skipped check in the last 10 minutes, well past its --fallback-interval -- the tool itself is stuck (its watchers are not attempting anything at all), not merely discarding cycles."
