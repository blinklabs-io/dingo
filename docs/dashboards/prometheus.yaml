## Prometheus scrape configuration for Dingo dashboards
##
## Add these jobs to your prometheus.yml under scrape_configs:

scrape_configs:
  # Dingo node metrics (default port 12798)
  - job_name: dingo
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:12798']

  # Node exporter for host-level metrics (required by Resource Usage dashboard)
  - job_name: node
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9100']

  # node-parity (blinklabs-io/dingo#1900): cross-node ledger-state
  # comparison against a reference cardano-node. Scrape both this tool's own
  # /metrics (node_parity_* counters, already network-labeled by the tool
  # itself) and the reference cardano-node's own :12798/metrics under a
  # distinct job so a same-height check (job="dingo" vs
  # job="cardano-node-reference") needs no new Go code.
  - job_name: node-parity
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9464']

  - job_name: cardano-node-reference
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:12798']
