# promtool test cases for docs/dashboards/alerts.yaml.
#
#   promtool test rules docs/dashboards/alerts_test.yaml
#
# NodeParityFromGenesisStalled's startup window is the case a plain
# `promtool check rules` cannot see: the rule parses and the PromQL is valid,
# but on a fresh process it fired against a healthy replay.
# node_parity_epochs_total and node_parity_epoch_checks_incomplete_total are
# pre-materialized at 0, so rate() over them is a real 0 rather than absent
# data, and the rule was true from the second scrape onward.
#
# The DingoWritePoolContention, DingoWALBytesHigh and
# DingoBlockfetchDelayHigh cases replay the shape of a metadata VACUUM stall:
# the write pool's cumulative wait jumps while the WAL grows by gigabytes and
# the blockfetch delay ring reports a single block minutes late.
rule_files:
  - alerts.yaml

evaluation_interval: 1m

tests:
  # A fresh process whose first epoch takes 20 minutes -- ordinary for a
  # from-genesis replay, and more so for an --at-slot resume that starts at
  # a deep epoch rather than the cheap early ones. Nothing may fire before
  # the process has been up as long as the rule's own [2h] window.
  - interval: 1m
    name: a healthy fresh run does not alert during its first epoch
    input_series:
      - series: 'node_parity_epochs_total{network="preview",job="node-parity",instance="localhost:9464"}'
        values: '0+0x20 1+0x40'
      - series: 'node_parity_epoch_checks_incomplete_total{network="preview",job="node-parity",instance="localhost:9464",field="utxo"}'
        values: '0+0x60'
      # Process started at t=0, so age in seconds equals the eval time.
      - series: 'process_start_time_seconds{job="node-parity",instance="localhost:9464"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 17m
        alertname: NodeParityFromGenesisStalled
        exp_alerts: []
      - eval_time: 25m
        alertname: NodeParityFromGenesisStalled
        exp_alerts: []
      - eval_time: 59m
        alertname: NodeParityFromGenesisStalled
        exp_alerts: []

  # The case the rule exists for: a process well past the grace window that
  # has genuinely stopped advancing. The gate must not suppress this.
  - interval: 1m
    name: a real stall past the grace window still alerts
    input_series:
      - series: 'node_parity_epochs_total{network="preview",job="node-parity",instance="localhost:9464"}'
        values: '0+0x400'
      - series: 'node_parity_epoch_checks_incomplete_total{network="preview",job="node-parity",instance="localhost:9464",field="utxo"}'
        values: '0+0x400'
      - series: 'process_start_time_seconds{job="node-parity",instance="localhost:9464"}'
        values: '0+0x400'
    alert_rule_test:
      # 2h grace, then "for: 15m".
      - eval_time: 136m
        alertname: NodeParityFromGenesisStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              network: preview
              job: node-parity
              instance: localhost:9464
            exp_annotations:
              summary: "node-parity from-genesis has stopped advancing on preview"
              description: "localhost:9464 (job node-parity) has recorded no from-genesis epoch, verified or incomplete, in the last 2 hours -- the replay is stalled rather than merely slow."

  # Healthy node: no write-pool wait, a WAL at its steady-state floor and
  # block delays of a couple of seconds. Nothing in the VACUUM-stall family
  # may fire.
  - interval: 1m
    name: a healthy node does not alert on the stall signals
    input_series:
      - series: 'dingo_database_sql_pool_wait_duration_seconds_total{pool="write",job="dingo",instance="n1:12798"}'
        values: '0+0x30'
      - series: 'dingo_database_sql_wal_bytes{job="dingo",instance="n1:12798"}'
        values: '41943040+0x30'
      - series: 'dingo_blockfetch_recent_delay_seconds{idx="0",job="dingo",instance="n1:12798"}'
        values: '2+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DingoWritePoolContention
        exp_alerts: []
      - eval_time: 20m
        alertname: DingoWALBytesHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: DingoBlockfetchDelayHigh
        exp_alerts: []

  # Read-pool waiting is not the write-pool stall the rule names.
  - interval: 1m
    name: read pool waiting does not trigger the write pool rule
    input_series:
      - series: 'dingo_database_sql_pool_wait_duration_seconds_total{pool="read",job="dingo",instance="n1:12798"}'
        values: '0+30x30'
      - series: 'dingo_database_sql_pool_wait_duration_seconds_total{pool="write",job="dingo",instance="n1:12798"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DingoWritePoolContention
        exp_alerts: []

  # A VACUUM holding the write connection: the write pool accrues wait,
  # the WAL balloons and one block arrives minutes late.
  - interval: 1m
    name: a metadata VACUUM stall fires every stall signal
    input_series:
      - series: 'dingo_database_sql_pool_wait_duration_seconds_total{pool="write",job="dingo",instance="n1:12798"}'
        values: '0+0x10 167+0x20'
      - series: 'dingo_database_sql_wal_bytes{job="dingo",instance="n1:12798"}'
        values: '8600000+0x10 11520000000+0x20'
      - series: 'dingo_blockfetch_recent_delay_seconds{idx="0",job="dingo",instance="n1:12798"}'
        values: '2+0x10 146.5+0x2 2+0x18'
      - series: 'dingo_blockfetch_recent_delay_seconds{idx="1",job="dingo",instance="n1:12798"}'
        values: '2+0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: DingoWritePoolContention
        exp_alerts:
          - exp_labels:
              severity: warning
              pool: write
              job: dingo
              instance: n1:12798
            exp_annotations:
              summary: "Dingo write pool is contended on n1:12798"
              description: "Node n1:12798: callers waited more than 5 seconds in total for the metadata write connection in the last 5 minutes. A long write transaction or maintenance job is holding it and ledger writes are queueing."
      - eval_time: 14m
        alertname: DingoWALBytesHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: dingo
              instance: n1:12798
            exp_annotations:
              summary: "Dingo SQLite WAL is oversized on n1:12798"
              description: "Node n1:12798: the metadata WAL file has stayed above 500 MiB for 1 minute. A bulk rewrite such as VACUUM, or a checkpoint blocked by a long-lived reader, is in progress."
      - eval_time: 14m
        alertname: DingoBlockfetchDelayHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: dingo
              instance: n1:12798
            exp_annotations:
              summary: "Dingo block propagation is delayed on n1:12798"
              description: "Node n1:12798: a recently fetched block arrived more than 10 seconds after its slot time in the last 5 minutes."
      # The delay ring drained back to normal; max_over_time's window has
      # moved past the late block.
      - eval_time: 25m
        alertname: DingoBlockfetchDelayHigh
        exp_alerts: []
