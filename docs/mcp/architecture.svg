<title id="title">Dingo MCP architecture</title>
<desc id="desc">MCP clients pass through origin, authentication, and rate-limit middleware, then HTTP transports and MCP tools. Data source cards name which tools read live node services, the active SQLite pool, and the context-aware database API.</desc>
