# Dingo Cardano Node - Docker Compose Configuration
#
# Usage:
#   docker compose up -d                        # Start with defaults (preview network)
#   CARDANO_NETWORK=mainnet docker compose up -d # Start on mainnet
#
# With Mithril snapshot bootstrap (first run only):
#   RESTORE_SNAPSHOT=1 docker compose up -d

services:
  # --------------------------------------------------------------------------
  # Basic relay node
  #
  # No API listener runs here. storageMode stays at its "core" default, and
  # the Blockfrost, Mesh, and UTxO RPC listeners only start under storageMode
  # "api". Turning one on means editing this file, not setting a shell
  # variable: unlike CARDANO_NETWORK above, neither DINGO_STORAGE_MODE nor
  # DINGO_API_BIND_ADDR is forwarded from the host, and no shell variable can
  # add a port publish either. Add DINGO_STORAGE_MODE=api and a container-side
  # wildcard bind -- DINGO_API_BIND_ADDR=0.0.0.0, or
  # DINGO_PLUGINS_API_<NAME>_CONFIG_HOST=0.0.0.0 for a single listener -- to
  # the environment below, and publish that listener's port. Both edits are
  # needed: those listeners bind loopback by default, and a container's
  # loopback is reachable only from inside that container, so neither a
  # published port nor a sibling container on the same Docker network reaches
  # a listener still on 127.0.0.1. A container-side wildcard is a
  # non-loopback bind, so it also needs api.auth configured -- startup
  # refuses an unauthenticated one. examples/docker-compose.yml is a working
  # API node with all three listeners and a token wired up.
  # --------------------------------------------------------------------------
  dingo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/blinklabs-io/dingo:latest
    restart: unless-stopped
    environment:
      - CARDANO_NETWORK=${CARDANO_NETWORK:-preview}
      - CARDANO_DATABASE_PATH=/data/db
      - DINGO_SOCKET_PATH=/ipc/dingo.socket
      # Uncomment to enable debug logging
      # - DINGO_DEBUG=1
      # Forwarded from the host only when set, per the header's
      # "RESTORE_SNAPSHOT=1 docker compose up -d". A bare name is passed
      # through when the host sets it and omitted entirely when it does not,
      # so this adds no snapshot bootstrap by default.
      - RESTORE_SNAPSHOT
    ports:
      # Ouroboros Node-to-Node (relay port)
      - "3001:3001"
      # Prometheus metrics (localhost only on the host)
      - "127.0.0.1:12798:12798"
    volumes:
      # Persistent database storage
      - dingo-data:/data/db
      # Unix socket for cardano-cli and other NtC clients
      - dingo-ipc:/ipc
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:12798/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  dingo-data:
    driver: local
  dingo-ipc:
    driver: local
