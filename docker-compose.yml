# Dingo Cardano Node - Docker Compose Configuration
#
# Usage:
#   docker compose up -d                        # Start with defaults (preview network)
#   CARDANO_NETWORK=mainnet docker compose up -d # Start on mainnet
#
# With Mithril snapshot bootstrap (first run only):
#   RESTORE_SNAPSHOT=1 docker compose up -d

services:
  # --------------------------------------------------------------------------
  # Basic relay node
  # --------------------------------------------------------------------------
  dingo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/blinklabs-io/dingo:latest
    restart: unless-stopped
    environment:
      - CARDANO_NETWORK=${CARDANO_NETWORK:-preview}
      - CARDANO_DATABASE_PATH=/data/db
      - DINGO_SOCKET_PATH=/ipc/dingo.socket
      # API listeners bind loopback by default, which a container port
      # mapping cannot reach. Widen only the listener this file publishes;
      # a container-side bind is reachable by every other container on the
      # same Docker network, so apiBindAddr stays on loopback and
      # Blockfrost/Mesh stay unreachable rather than being widened along
      # with it. Set DINGO_PLUGINS_API_<NAME>_CONFIG_HOST per listener, or
      # DINGO_API_BIND_ADDR to widen all three at once.
      - DINGO_PLUGINS_API_UTXORPC_CONFIG_HOST=0.0.0.0
      # Uncomment to enable debug logging
      # - DINGO_DEBUG=1
      # Uncomment to bootstrap from Mithril snapshot on first run
      # - RESTORE_SNAPSHOT=1
    ports:
      # Ouroboros Node-to-Node (relay port)
      - "3001:3001"
      # Prometheus metrics (localhost only by default)
      - "127.0.0.1:12798:12798"
      # UTxO RPC (gRPC, localhost only by default)
      - "127.0.0.1:9090:9090"
    volumes:
      # Persistent database storage
      - dingo-data:/data/db
      # Unix socket for cardano-cli and other NtC clients
      - dingo-ipc:/ipc
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:12798/metrics"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  dingo-data:
    driver: local
  dingo-ipc:
    driver: local
